function setProjFlow(flow){
  window._projFlow = flow;
  document.querySelectorAll('#projFlowToggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.flow === flow);
  });
}

async function submitProjectionItem(editingId){
  const entity = currentEntity();
  const description = document.getElementById('projDescription').value.trim();
  const amount = parseFloat(document.getElementById('projAmount').value);
  const categoryId = document.getElementById('projCategory').value || null;
  const dueDate = document.getElementById('projDueDate').value;
  const originalDate = document.getElementById('projOriginalDate').value || null;
  const flow = window._projFlow;

  if (!description) { toast('Informe uma descrição.', 'error'); return; }
  if (!amount || amount <= 0) { toast('Informe um valor válido.', 'error'); return; }
  if (!dueDate) { toast('Informe o vencimento previsto.', 'error'); return; }

  const payload = {
    entity_id: entity.id,
    category_id: categoryId,
    description, amount,
    flow_type: flow,
    due_date: dueDate,
    original_due_date: originalDate
  };

  try {
    if (editingId) {
      const { error } = await supabaseClient.from('projection_items').update(payload).eq('id', editingId);
      if (error) throw error;
      toast('Item de projeção atualizado.');
    } else {
      const { error } = await supabaseClient.from('projection_items').insert(payload);
      if (error) throw error;
      toast('Item de projeção criado.');
    }
    closeModal();
    await loadEntityData();
    render();
  } catch (err) {
    toast('Erro ao salvar: ' + err.message, 'error');
  }
}

async function deleteProjectionItem(id){
  if (!confirm('Excluir este item de projeção?')) return;
  try {
    const { error } = await supabaseClient.from('projection_items').delete().eq('id', id);
    if (error) throw error;
    toast('Item excluído.');
    closeModal();
    await loadEntityData();
    render();
  } catch (err) {
    toast('Erro ao excluir: ' + err.message, 'error');
  }
}

/* ============================================================
   PÁGINA: CUSTOS FIXOS (cadastro simples, base pro Ponto de Equilíbrio)
   ============================================================ */
/* ============================================================
   PÁGINA: GESTÃO DO GRUPO
   Cadastro de empresas — cria entidade + categorias padrão +
   contas básicas diretamente pelo sistema, sem precisar de SQL.
   ============================================================ */
/* ============================================================
   PÁGINA: CONTROLE DE IMPOSTOS
   Registro manual por emissão de NF:
   Período | Fat. NF | Simples Nacional | DARF Unificado | Total
   Isolado do fluxo de caixa — apenas controle.
   ============================================================ */
function renderImpostos(){
  const allEntries = state.taxEntries;
  const selectedMonth = window._impostoMonth || '';

  // meses disponíveis para o filtro
  const availableMonths = [...new Set(allEntries.map(e => e.period_date?.slice(0,7)).filter(Boolean))].sort().reverse();

  // aplica filtro
  const entries = selectedMonth
    ? allEntries.filter(e => e.period_date?.startsWith(selectedMonth))
    : allEntries;

  const totalFat    = entries.reduce((s,e) => s + Number(e.nf_amount || 0), 0);
  const totalSimples = entries.reduce((s,e) => s + Number(e.simples_amount || 0), 0);
  const totalDarf   = entries.reduce((s,e) => s + Number(e.darf_amount || 0), 0);
  const totalImp    = totalSimples + totalDarf;
  const taxPct      = totalFat > 0 ? (totalImp / totalFat) * 100 : 0;

  // formata YYYY-MM para "Mês/Ano" legível
  const fmtMonth = (key) => {
    const [y,m] = key.split('-');
    return `${MONTH_NAMES[Number(m)-1]}/${y}`;
  };

  return `
    <!-- Filtro por mês -->
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:16px; flex-wrap:wrap;">
      <span style="font-size:12px; color:var(--text-faint);">Período:</span>
      <button onclick="window._impostoMonth=''; render()"
        class="btn btn-sm ${!selectedMonth ? 'btn-primary pj' : 'btn-ghost'}"
        style="font-size:11.5px; padding:4px 12px;">
        Todos
      </button>
      ${availableMonths.map(m => `
        <button onclick="window._impostoMonth='${m}'; render()"
          class="btn btn-sm ${selectedMonth === m ? 'btn-primary pj' : 'btn-ghost'}"
          style="font-size:11.5px; padding:4px 12px;">
          ${fmtMonth(m)}
        </button>
      `).join('')}
    </div>

    <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px;">
      <div class="kpi-card">
        <div class="kpi-label">Faturamento NF ${selectedMonth ? fmtMonth(selectedMonth) : 'Total'}</div>
        <div class="kpi-value positive">${formatMoney(totalFat)}</div>
        <div class="kpi-sub">${entries.length} lançamento${entries.length !== 1 ? 's' : ''}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Simples Nacional</div>
        <div class="kpi-value negative">${formatMoney(totalSimples)}</div>
        <div class="kpi-sub">${totalFat > 0 ? ((totalSimples/totalFat)*100).toFixed(2) + '% do fat.' : '—'}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">DARF Unificado</div>
        <div class="kpi-value negative">${formatMoney(totalDarf)}</div>
      </div>
      <div class="kpi-card" style="border-top:3px solid var(--danger);">
        <div class="kpi-label">Total de Impostos</div>
        <div class="kpi-value negative">${formatMoney(totalImp)}</div>
        <div class="kpi-sub">${taxPct.toFixed(2)}% sobre o faturamento</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header"><div class="panel-title">Lançamentos</div></div>
      ${entries.length === 0 ? `
        <div class="empty-state">
          <div class="empty-state-title">Nenhum lançamento ainda</div>
          <div>Clique em "+ Novo lançamento" para registrar uma emissão de NF e seus impostos.</div>
        </div>
      ` : `
        <table>
          <thead>
            <tr>
              <th>Período / Vencimento</th>
              <th style="text-align:right;">Fat. NF (R$)</th>
              <th style="text-align:right;">Simples Nacional</th>
              <th style="text-align:right;">DARF Unificado</th>
              <th style="text-align:right;">Total Impostos</th>
              <th style="text-align:center;">Pago</th>
            </tr>
          </thead>
          <tbody>
            ${entries.map(e => {
              const total = Number(e.simples_amount || 0) + Number(e.darf_amount || 0);
              const pct = e.nf_amount > 0 ? ((e.simples_amount / e.nf_amount) * 100).toFixed(2) : '—';
              return `
                <tr style="cursor:pointer;" onclick="openImpostoModal('${e.id}')">
                  <td>
                    <div style="display:flex; align-items:center; gap:6px;">
                      ${e.attachment_base64 ? `<span onclick="event.stopPropagation(); viewSavedAttachment(state.taxEntries.find(x=>x.id==='${e.id}')?.attachment_base64, '${escapeHtml(e.attachment_name||'Anexo')}')" style="cursor:pointer; font-size:14px;" title="Ver ${escapeHtml(e.attachment_name||'anexo')}">📄</span>` : ''}
                      <div>
                        <div>${formatDate(e.period_date)}</div>
                        ${e.description ? `<div style="font-size:11px; color:var(--text-faint);">${escapeHtml(e.description)}</div>` : ''}
                      </div>
                    </div>
                  </td>
                  <td class="amount in" style="text-align:right;">${formatMoney(e.nf_amount || 0)}</td>
                  <td style="text-align:right;">
                    <div class="amount out">${formatMoney(e.simples_amount || 0)}</div>
                    <div style="font-size:10.5px; color:var(--text-faint);">${pct}%</div>
                  </td>
                  <td class="amount out" style="text-align:right;">${formatMoney(e.darf_amount || 0)}</td>
                  <td class="amount out" style="text-align:right; font-weight:700;">${formatMoney(total)}</td>
                  <td style="text-align:center;" onclick="event.stopPropagation();">
                    <input type="checkbox" ${e.paid ? 'checked' : ''} onchange="toggleImpostoPago('${e.id}', this.checked)" style="width:15px; height:15px; cursor:pointer;">
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
          <tfoot>
            <tr style="border-top:2px solid var(--border);">
              <td style="font-weight:700;">Total</td>
              <td class="amount in" style="text-align:right; font-weight:700;">${formatMoney(totalFat)}</td>
              <td class="amount out" style="text-align:right; font-weight:700;">${formatMoney(totalSimples)}</td>
              <td class="amount out" style="text-align:right; font-weight:700;">${formatMoney(totalDarf)}</td>
              <td class="amount out" style="text-align:right; font-weight:700;">${formatMoney(totalImp)}</td>
              <td></td>
            </tr>
          </tfoot>
        </table>
      `}
    </div>
  `;
}

function calcSimples(){
  const nf = parseFloat(document.getElementById('impNF')?.value) || 0;
  const simplesEl = document.getElementById('impSimples');
  if (simplesEl && nf > 0) simplesEl.value = (nf * 0.06).toFixed(2);
  updateImpostoTotal();
}

function updateImpostoTotal(){
  const simples = parseFloat(document.getElementById('impSimples')?.value) || 0;
  const darf    = parseFloat(document.getElementById('impDarf')?.value) || 0;
  const el = document.getElementById('impTotal');
  if (el) el.textContent = formatMoney(simples + darf);
}

async function submitImposto(editingId){
  const entity = currentEntity();
  const periodDate = document.getElementById('impPeriod').value;
  const nfAmount   = parseFloat(document.getElementById('impNF').value) || 0;
  const simples    = parseFloat(document.getElementById('impSimples').value) || 0;

  if (!periodDate) { toast('Informe a data.', 'error'); return; }

  const payload = {
    entity_id: entity.id,
    period_date: periodDate,
    nf_amount: nfAmount,
    simples_amount: simples,
    darf_amount: darf,
    description: desc || null,
    attachment_base64: document.getElementById('attachBase64')?.value || null,
    attachment_name: document.getElementById('attachName')?.value || null,
  };

  try {
    if (editingId) {
      const { error } = await supabaseClient.from('tax_entries').update(payload).eq('id', editingId);
      if (error) throw error;
      toast('Lançamento atualizado.');

      if (error) throw error;

    await loadTaxEntries();
    render();

async function submitNewCompany(editingId){
  const name = document.getElementById('companyName').value.trim();
  if (!name) { toast('Informe o nome da empresa.', 'error'); return; }

  try {
    if (editingId) {
      // só edita o nome
      const { error } = await supabaseClient.from('entities').update({ name }).eq('id', editingId);
      if (error) throw error;
      toast('Empresa atualizada.');
      closeModal();
      await loadEntities();
      render();
      return;
    }

    // Cria a entidade
    const { data: entity, error: entErr } = await supabaseClient
      .from('entities').insert({ name, kind: 'pj', is_active: true }).select().single();
    if (entErr) throw entErr;

    // Cria grupos e categorias padrão
    const grupos = [
      { name: 'Receita de Vendas',         flow_type: 'entrada', cats: ['Consultoria','Assessoria','Outros'] },
      { name: 'Custos Variáveis',           flow_type: 'saida',   cats: ['Comissões','Impostos sobre vendas','Outros CV'] },
      { name: 'Despesas com Pessoal',       flow_type: 'saida',   cats: ['Pró-labore','Salários','Encargos'] },
      { name: 'Despesas Operacionais',      flow_type: 'saida',   cats: ['Aluguel','Contabilidade','Internet','Outros'] },
      { name: 'Entradas Não Operacionais',  flow_type: 'entrada', cats: ['Rendimentos','Outros'] },
      { name: 'Saídas Não Operacionais',    flow_type: 'saida',   cats: ['Investimentos','Outros'] },
      { name: 'Transferência Recebida',     flow_type: 'entrada', cats: ['Transferência Recebida'] },
      { name: 'Transferência Enviada',      flow_type: 'saida',   cats: ['Transferência Enviada'] },
    ];

    for (const g of grupos) {
      const { data: grp, error: grpErr } = await supabaseClient
        .from('groups').insert({ entity_id: entity.id, name: g.name, flow_type: g.flow_type }).select().single();
      if (grpErr) throw grpErr;

      const catRows = g.cats.map(c => ({ group_id: grp.id, name: c }));
      const { error: catErr } = await supabaseClient.from('categories').insert(catRows);
      if (catErr) throw catErr;
    }

    // Cria contas bancárias informadas
    const accountsRaw = document.getElementById('companyAccounts')?.value || 'Conta Principal, Caixa';

async function submitFixedCost(editingId){
  const entity = currentEntity();
  const name = document.getElementById('fcName').value.trim();
  const amount = parseFloat(document.getElementById('fcAmount').value);
  const dueDay = document.getElementById('fcDueDay').value ? parseInt(document.getElementById('fcDueDay').value) : null;
  const categoryId = document.getElementById('fcCategory').value || null;
  const notes = document.getElementById('fcNotes').value.trim();

  if (!name) { toast('Informe um nome.', 'error'); return; }
  if (!amount || amount <= 0) { toast('Informe um valor válido.', 'error'); return; }
  if (dueDay && (dueDay < 1 || dueDay > 31)) { toast('Dia de vencimento deve ser entre 1 e 31.', 'error'); return; }

  const payload = { entity_id: entity.id, name, monthly_amount: amount, due_day: dueDay, category_id: categoryId, notes: notes || null };

  try {
    let valueChanged = false;
    if (editingId) {
      const existing = state.fixedCosts.find(c => c.id === editingId);
      valueChanged = existing && Number(existing.monthly_amount) !== amount;

      const { error } = await supabaseClient.from('fixed_costs').update(payload).eq('id', editingId);
      if (error) throw error;

      // Se o valor mudou e já existem lançamentos futuros gerados, pergunta se quer atualizar
      const today = new Date().toISOString().slice(0,10);
      const futureTxs = state.transactions.filter(t => t.fixed_cost_id === editingId && t.status === 'previsto' && t.date_competencia >= today);
      if (valueChanged && futureTxs.length > 0) {
        const updateFuture = confirm(`O valor mudou. Atualizar também os ${futureTxs.length} lançamento(s) futuro(s) já gerado(s) (ainda não pagos)?`);
        if (updateFuture) {
          const { error: updError } = await supabaseClient.from('transactions').update({ amount }).in('id', futureTxs.map(t=>t.id));
          if (updError) throw updError;
          toast(`Custo fixo e ${futureTxs.length} lançamento(s) futuro(s) atualizados.`);
        } else {
          toast('Custo fixo atualizado. Lançamentos futuros mantidos como estavam.');
        }
      } else {
        toast('Custo fixo atualizado.');
      }
    } else {
      const { error } = await supabaseClient.from('fixed_costs').insert(payload);
      if (error) throw error;
      toast('Custo fixo criado.');
    }
    closeModal();
    await loadEntityData();
    render();
  } catch (err) {
    toast('Erro ao salvar: ' + err.message, 'error');
  }
}

/* ============================================================
   GERAR LANÇAMENTOS FUTUROS A PARTIR DE UM CUSTO FIXO
   Gera 12 meses de lançamentos PREVISTOS, a partir de hoje
   (inclusive), no dia de vencimento configurado. Se já existirem
   lançamentos futuros gerados anteriormente, eles são substituídos
   (apaga só os "previsto" + fixed_cost_id, nunca mexe no realizado).
   ============================================================ */
async function generateFixedCostInstallments(fixedCostId){
  const cost = state.fixedCosts.find(c => c.id === fixedCostId);
  if (!cost) return;
  if (!cost.due_day || !cost.category_id) { toast('Defina dia de vencimento e categoria antes de gerar.', 'error'); return; }

  const entity = currentEntity();
  const today = new Date();
  const todayStr = today.toISOString().slice(0,10);

  if (!confirm(`Gerar os próximos 12 meses de lançamentos previstos para "${cost.name}", todo dia ${cost.due_day}, a partir de hoje?`)) return;

  try {
    // remove lançamentos futuros PREVISTOS já gerados anteriormente (nunca mexe em realizados)
    const { error: delError } = await supabaseClient.from('transactions')
      .delete()
      .eq('fixed_cost_id', fixedCostId)
      .eq('status', 'previsto')
      .gte('date_competencia', todayStr);
    if (delError) throw delError;

    // gera 12 meses a partir do mês atual
    const payload = [];
    for (let i = 0; i < 12; i++) {
      const refDate = new Date(today.getFullYear(), today.getMonth() + i, 1);
      const year = refDate.getFullYear();
      const month = refDate.getMonth();
      const lastDayOfMonth = new Date(year, month + 1, 0).getDate();
      const day = Math.min(cost.due_day, lastDayOfMonth); // protege meses com menos dias (fev, etc.)
      const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;

      if (dateStr < todayStr) continue; // não gera no passado

      payload.push({
        entity_id: entity.id,
        category_id: cost.category_id,
        fixed_cost_id: fixedCostId,
        description: cost.name,
        amount: cost.monthly_amount,
        flow_type: 'saida',
        date_competencia: dateStr,
        date_realizado: null,
        status: 'previsto',
        source: 'manual'
      });
    }

    if (payload.length > 0) {
      const { error: insError } = await supabaseClient.from('transactions').insert(payload);
      if (insError) throw insError;
    }

    toast(`${payload.length} lançamento(s) gerado(s) no fluxo de caixa.`);
    closeModal();
    await loadEntityData();
    render();
  } catch (err) {
    console.error(err);
    toast('Erro ao gerar lançamentos: ' + err.message, 'error');
  }
}

/* ============================================================
   PÁGINA: PONTO DE EQUILÍBRIO
   PE (R$) = Custos Fixos Totais ÷ % Margem de Contribuição
   % MC calculada como média móvel dos últimos N meses
   realizados (3/6/12, padrão 3), igual lógica do Barber Finance.
   ============================================================ */
window._peMonths = 3;

/* Retorna a % de MC de cada um dos últimos N meses com dado realizado,
   mais recente primeiro. Usa todas as transações da entidade (não filtra
   por state.period — o PE é sempre uma análise de tendência recente). */
function computeRecentMonthlyMC(n){
  const txs = state.transactions.filter(t => t.status === 'realizado' && t.date_competencia);
  const byMonth = {};
  txs.forEach(t => {
    const key = t.date_competencia.slice(0,7);
    if (!byMonth[key]) byMonth[key] = [];
    byMonth[key].push(t);
  });
  const monthKeys = Object.keys(byMonth).sort().reverse().slice(0, n);
  return monthKeys.map(key => {
    const dre = computeDRE(byMonth[key]);
    const [y,m] = key.split('-');
    return { key, label: `${MONTH_NAMES[Number(m)-1].slice(0,3)}/${y.slice(2)}`, receita: dre.receita, pctMC: dre.pctMC };
  }).reverse(); // cronológico pro gráfico
}

function renderPontoEquilibrio(){
  const n = window._peMonths;
  const monthlyMC = computeRecentMonthlyMC(n);
  const totalFixedCosts = state.fixedCosts.reduce((s,c) => s + Number(c.monthly_amount), 0);

  if (monthlyMC.length === 0) {
    return `
      <div class="empty-state">
        <div class="empty-state-title">Sem dados realizados suficientes</div>
        <div>Lance algumas receitas e custos variáveis no fluxo de caixa para calcular o Ponto de Equilíbrio.</div>
      </div>
    `;
  }

  const avgPctMC = monthlyMC.reduce((s,m) => s + m.pctMC, 0) / monthlyMC.length;
  const pontoEquilibrio = avgPctMC > 0 ? totalFixedCosts / (avgPctMC / 100) : 0;

  // receita do mês mais recente disponível, para margem de segurança
  const latestMonth = monthlyMC[monthlyMC.length - 1];
  const receitaAtual = latestMonth ? latestMonth.receita : 0;
  const margemSeguranca = receitaAtual - pontoEquilibrio;
  const margemSegurancaPct = pontoEquilibrio > 0 ? (margemSeguranca / pontoEquilibrio) * 100 : 0;

  return `
    <div class="bridge-note" style="margin-bottom:16px;">
      <span>ℹ</span>
      <span>Ponto de Equilíbrio = Custos Fixos ÷ % Margem de Contribuição. A % de MC usa a média dos últimos ${n} meses realizados — ajuste a janela abaixo.</span>
    </div>

    <div style="display:flex; gap:8px; margin-bottom:18px;">
      ${[3,6,12].map(opt => `
        <button class="btn btn-sm ${n === opt ? 'btn-primary ' + state.entityKind : 'btn-ghost'}" onclick="window._peMonths=${opt}; render();">${opt} meses</button>
      `).join('')}
    </div>

    <div class="kpi-row">
      <div class="kpi-card">
        <div class="kpi-label">Custos Fixos Totais</div>
        <div class="kpi-value negative">${formatMoney(totalFixedCosts)}</div>
        <div class="kpi-sub">${state.fixedCosts.length} itens cadastrados</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">% Margem de Contribuição (média)</div>
        <div class="kpi-value" style="color:var(--text);">${avgPctMC.toFixed(1)}%</div>
        <div class="kpi-sub">média de ${monthlyMC.length} meses</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Ponto de Equilíbrio</div>
        <div class="kpi-value" style="color:var(--warn);">${formatMoney(pontoEquilibrio)}</div>
        <div class="kpi-sub">faturamento mínimo necessário/mês</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Margem de Segurança</div>
        <div class="kpi-value ${margemSeguranca >= 0 ? 'positive' : 'negative'}">${formatMoney(margemSeguranca)}</div>
        <div class="kpi-sub">${margemSegurancaPct.toFixed(1)}% ${margemSeguranca >= 0 ? 'acima' : 'abaixo'} do PE (mês ${latestMonth.label})</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header"><div class="panel-title">Receita vs Ponto de Equilíbrio — últimos ${n} meses</div></div>
      <div style="padding:16px;">${renderBreakEvenChart(monthlyMC, pontoEquilibrio)}</div>
    </div>
  `;
}

/* Gráfico de barras (receita mensal) com linha de referência do PE */
function renderBreakEvenChart(monthlyMC, pontoEquilibrio){
  const W = 600, H = 200, padL = 16, padR = 16, padTop = 20, padBottom = 28;
  const values = monthlyMC.map(m => m.receita);
  const max = Math.max(...values, pontoEquilibrio, 1) * 1.1;

  const n = monthlyMC.length;
  const barGap = 8;
  const barWidth = (W - padL - padR) / n - barGap;

  const yFor = (v) => padTop + (H - padTop - padBottom) * (1 - v / max);
  const peY = yFor(pontoEquilibrio);

  const bars = monthlyMC.map((m, i) => {
    const x = padL + i * ((W - padL - padR) / n) + barGap / 2;
    const barH = (H - padTop - padBottom) * (m.receita / max);
    const y = H - padBottom - barH;
    const aboveOrBelow = m.receita >= pontoEquilibrio ? 'var(--pj)' : 'var(--danger)';
    return `
      <g>
        <text x="${x + barWidth/2}" y="${y - 5}" text-anchor="middle" font-size="9" fill="var(--text-dim)" font-family="var(--font-mono)">${(m.receita/1000).toFixed(1)}k</text>
        <rect x="${x}" y="${y}" width="${barWidth}" height="${Math.max(barH,1)}" rx="3" fill="${aboveOrBelow}" opacity="0.85">
          <title>${m.label}: ${formatMoney(m.receita)}</title>
        </rect>
        <text x="${x + barWidth/2}" y="${H - 9}" text-anchor="middle" font-size="9.5" fill="var(--text-faint)" font-family="var(--font-body)">${m.label}</text>
      </g>
    `;
  }).join('');

  return `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; display:block;">
      <line x1="${padL}" y1="${peY.toFixed(1)}" x2="${W-padR}" y2="${peY.toFixed(1)}" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="4 4">
        <title>Ponto de Equilíbrio: ${formatMoney(pontoEquilibrio)}</title>
      </line>
      <text x="${W-padR}" y="${peY.toFixed(1)-5}" text-anchor="end" font-size="9.5" fill="var(--warn)" font-family="var(--font-mono)">PE: ${formatMoney(pontoEquilibrio)}</text>
      ${bars}
    </svg>
  `;
}

          ${t.attachment_base64 ? `<span onclick="event.stopPropagation(); viewSavedAttachment(state.transactions.find(x=>x.id==='${t.id}')?.attachment_base64, '${escapeHtml(t.attachment_name||'Anexo')}')" style="cursor:pointer; font-size:13px;" title="Ver ${escapeHtml(t.attachment_name||'anexo')}">📄</span>` : ''}
          <span>${escapeHtml(t.description)}</span>
          ${isBridge ? `<span class="bridge-tag" style="margin-left:4px;" title="Transferência">⇄</span>` : ''}
        </div>
      </td>
      <td onclick="openTransactionModal('${t.id}')" style="cursor:pointer;"><span class="cat-pill">${escapeHtml(catName)}</span></td>
      <td onclick="openTransactionModal('${t.id}')" style="cursor:pointer;"><span class="status-pill ${t.reconciliation_status === 'aguardando' ? 'aguardando' : t.status}">${t.reconciliation_status === 'aguardando' ? 'Aguardando' : (t.status === 'realizado' ? 'Realizado' : 'Previsto')}</span></td>
      <td class="amount ${t.flow_type === 'entrada' ? 'in' : 'out'}" style="text-align:right; cursor:pointer;" onclick="openTransactionModal('${t.id}')">
        ${t.flow_type === 'entrada' ? '+' : '−'} ${formatMoney(t.amount)}
      </td>

  `;
}

/* ============================================================
   PÁGINA: CALENDÁRIO DE PAGAMENTOS E RECEBIMENTOS
   Mostra os lançamentos reais (transactions) numa grade mensal,
   igual ao Barber Finance. Não inclui itens de Projeção (isolada).
   ============================================================ */
window._calendarMonth = null; // { year, month } — inicializado no primeiro render

function ensureCalendarMonth(){
  if (!window._calendarMonth) {
    const now = new Date();
    window._calendarMonth = { year: now.getFullYear(), month: now.getMonth() + 1 };
  }
}

function shiftCalendarMonth(delta){
  ensureCalendarMonth();
  let { year, month } = window._calendarMonth;
  month += delta;
  if (month > 12) { month = 1; year++; }
  if (month < 1) { month = 12; year--; }
  window._calendarMonth = { year, month };
  render();
}

function calendarToToday(){
  const now = new Date();
  window._calendarMonth = { year: now.getFullYear(), month: now.getMonth() + 1 };
  render();
}

function renderCalendario(){
  ensureCalendarMonth();
  const { year, month } = window._calendarMonth;
  const todayStr = new Date().toISOString().slice(0,10);

  // todos os lançamentos reais do mês em foco (por data de competência)
  // helper: identifica lançamentos de transferência (não entram nos indicadores)
  const isTransfer = t => !!t.mirror_transaction_id ||
    t.categories?.name === 'Transferência Enviada' ||
    t.categories?.name === 'Transferência Recebida';

  // PENDÊNCIAS EM ATRASO — previstos com data anterior a hoje, qualquer mês
  const overdueTxs = state.transactions.filter(t =>
    t.status === 'previsto' &&
    t.date_competencia < todayStr &&
    !isTransfer(t) &&
    t.flow_type === 'saida'
  ).sort((a,b) => a.date_competencia.localeCompare(b.date_competencia));

  const overdueEntradas = state.transactions.filter(t =>
    t.status === 'previsto' &&
    t.date_competencia < todayStr &&
    !isTransfer(t) &&
    t.flow_type === 'entrada'
  );

  const totalOverdueSaidas  = overdueTxs.reduce((s,t) => s + Number(t.amount), 0);
  const totalOverdueEntradas = overdueEntradas.reduce((s,t) => s + Number(t.amount), 0);
  const isOverdueExpanded = window._overdueExpanded !== false; // expandido por padrão

  const overduePanel = (overdueTxs.length + overdueEntradas.length) > 0 ? `
    <div style="border:1px solid var(--danger); border-radius:var(--radius); margin-bottom:18px; overflow:hidden;">
      <div onclick="window._overdueExpanded = !window._overdueExpanded; render();"
        style="display:flex; align-items:center; justify-content:space-between; padding:10px 16px; background:var(--danger-soft); cursor:pointer; gap:12px;">
        <div style="display:flex; align-items:center; gap:10px;">
          <span style="font-size:14px;">⚠</span>
          <div>
            <div style="font-weight:700; font-size:13px; color:var(--danger);">
              ${overdueTxs.length + overdueEntradas.length} pendência${overdueTxs.length + overdueEntradas.length > 1 ? 's' : ''} em atraso
            </div>
            <div style="font-size:11.5px; color:var(--text-dim);">
              ${overdueTxs.length > 0 ? `Saídas: <strong style="color:var(--danger);">${formatMoney(totalOverdueSaidas)}</strong>` : ''}
              ${overdueEntradas.length > 0 ? `&nbsp;· Entradas: <strong style="color:var(--pj);">${formatMoney(totalOverdueEntradas)}</strong>` : ''}
            </div>
          </div>
        </div>
        <span style="font-size:11px; color:var(--text-faint);">${isOverdueExpanded ? '▴ recolher' : '▾ expandir'}</span>
      </div>

      ${isOverdueExpanded ? `
        <div style="padding:0 0 8px;">
          ${overdueTxs.length > 0 ? `
            <div style="padding:8px 16px 4px; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--danger); font-weight:600;">A pagar</div>
            <table style="width:100%;">
              ${overdueTxs.map(t => `
                <tr onclick="openTransactionModal('${t.id}')" style="cursor:pointer; border-bottom:1px solid var(--border);">
                  <td style="padding:7px 16px; font-size:12.5px;">${escapeHtml(t.description)}</td>
                  <td style="padding:7px 8px; font-size:11px; color:var(--text-faint);">${t.categories?.name || '—'}</td>
                  <td style="padding:7px 8px; font-size:11px; color:var(--text-faint);">venc. ${formatDate(t.date_competencia)}</td>
                  <td style="padding:7px 16px; text-align:right; font-weight:600; color:var(--danger);">${formatMoney(t.amount)}</td>
                </tr>
              `).join('')}
              <tr style="background:var(--danger-soft);">
                <td colspan="3" style="padding:7px 16px; font-weight:700; font-size:12.5px;">Total a pagar em atraso</td>
                <td style="padding:7px 16px; text-align:right; font-weight:700; color:var(--danger);">${formatMoney(totalOverdueSaidas)}</td>
              </tr>
            </table>
          ` : ''}
          ${overdueEntradas.length > 0 ? `
            <div style="padding:8px 16px 4px; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--pj); font-weight:600; margin-top:4px;">A receber</div>
            <table style="width:100%;">
              ${overdueEntradas.map(t => `
                <tr onclick="openTransactionModal('${t.id}')" style="cursor:pointer; border-bottom:1px solid var(--border);">
                  <td style="padding:7px 16px; font-size:12.5px;">${escapeHtml(t.description)}</td>
                  <td style="padding:7px 8px; font-size:11px; color:var(--text-faint);">${t.categories?.name || '—'}</td>
                  <td style="padding:7px 8px; font-size:11px; color:var(--text-faint);">venc. ${formatDate(t.date_competencia)}</td>
                  <td style="padding:7px 16px; text-align:right; font-weight:600; color:var(--pj);">${formatMoney(t.amount)}</td>
                </tr>
              `).join('')}
              <tr style="background:var(--pj-soft);">
                <td colspan="3" style="padding:7px 16px; font-weight:700; font-size:12.5px;">Total a receber em atraso</td>
                <td style="padding:7px 16px; text-align:right; font-weight:700; color:var(--pj);">${formatMoney(totalOverdueEntradas)}</td>
              </tr>
            </table>
          ` : ''}
        </div>
      ` : ''}
    </div>
  ` : '';

  const monthTxs = state.transactions.filter(t => {
    if (!t.date_competencia) return false;
    if (isTransfer(t)) return false;
    const [y,m] = t.date_competencia.split('-').map(Number);
    return y === year && m === month;
  });

  // agrupa por dia
  const byDay = {};
  monthTxs.forEach(t => {
    const day = Number(t.date_competencia.split('-')[2]);
    if (!byDay[day]) byDay[day] = [];
    byDay[day].push(t);
  });

  const firstOfMonth = new Date(year, month - 1, 1);
  const daysInMonth = new Date(year, month, 0).getDate();
  const startWeekday = firstOfMonth.getDay(); // 0=domingo

  // KPIs detalhados: realizado vs previsto vs a realizar
  const entradasRealizadas  = monthTxs.filter(t => t.flow_type==='entrada' && t.status==='realizado').reduce((s,t)=>s+Number(t.amount),0);
  const entradasPrevistas   = monthTxs.filter(t => t.flow_type==='entrada' && t.status==='previsto').reduce((s,t)=>s+Number(t.amount),0);
  const entradasTotal       = entradasRealizadas + entradasPrevistas;

  const saidasRealizadas    = monthTxs.filter(t => t.flow_type==='saida' && t.status==='realizado').reduce((s,t)=>s+Number(t.amount),0);
  const saidasPrevistas     = monthTxs.filter(t => t.flow_type==='saida' && t.status==='previsto').reduce((s,t)=>s+Number(t.amount),0);
  const saidasTotal         = saidasRealizadas + saidasPrevistas;

  const saldoRealizado      = entradasRealizadas - saidasRealizadas;
  const saldoARealizarVal   = entradasPrevistas - saidasPrevistas;
  const saldoTotal          = entradasTotal - saidasTotal;

  const totalEntradasPrevistas = entradasTotal;
  const totalSaidasPrevistas   = saidasTotal;
  const totalAtrasados = monthTxs.filter(t => t.status === 'previsto' && t.date_competencia < todayStr).length;

  // Saldo acumulado por dia:
  // Ponto de partida = saldo atual real das contas (initial_balance + realizados até hoje)
  const saldoAtualContas = state.accounts.reduce((s,a) => s + Number(a.initial_balance), 0)
    + state.transactions.filter(t => t.status === 'realizado' && t.flow_type === 'entrada' && t.date_competencia <= todayStr).reduce((s,t) => s + Number(t.amount), 0)
    - state.transactions.filter(t => t.status === 'realizado' && t.flow_type === 'saida'   && t.date_competencia <= todayStr).reduce((s,t) => s + Number(t.amount), 0);

  // Para dias antes de hoje: o saldo acumulado é o saldo real naquele momento histórico
  // Para hoje e futuros: parte do saldo atual e acumula previstos
  // Monta saldo acumulado por dia do mês
  const saldoAcumuladoPorDia = {};
  // Primeiro calcula o saldo no início do mês (antes do dia 1)
  const monthStr = `${year}-${String(month).padStart(2,'0')}`;
  const saldoInicioMes = state.accounts.reduce((s,a) => s + Number(a.initial_balance), 0)
    + state.transactions.filter(t => t.status === 'realizado' && t.flow_type === 'entrada' && t.date_competencia < `${monthStr}-01`).reduce((s,t) => s + Number(t.amount), 0)
    - state.transactions.filter(t => t.status === 'realizado' && t.flow_type === 'saida'   && t.date_competencia < `${monthStr}-01`).reduce((s,t) => s + Number(t.amount), 0);

  let saldoAcumulado = saldoInicioMes;
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${monthStr}-${String(d).padStart(2,'0')}`;
    const txsDay = byDay[d] || [];
    // realizados sempre contam; previstos só contam a partir de hoje
    txsDay.forEach(t => {
      if (t.status === 'realizado' || dateStr >= todayStr) {
        if (t.flow_type === 'entrada') saldoAcumulado += Number(t.amount);
        else saldoAcumulado -= Number(t.amount);
      }
    });
    saldoAcumuladoPorDia[d] = saldoAcumulado;
  }

  // monta células: espaços em branco antes do dia 1, depois os dias do mês
  let cells = '';
  for (let i = 0; i < startWeekday; i++) cells += `<div class="cal-cell cal-cell-empty"></div>`;

  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const items = byDay[day] || [];
    const isToday = dateStr === todayStr;
    const isPast = dateStr < todayStr;

    const entradas = items.filter(t => t.flow_type === 'entrada');
    const saidas = items.filter(t => t.flow_type === 'saida');
    const entradasTotalDia = entradas.reduce((s,t)=>s+Number(t.amount),0);
    const saidasTotalDia = saidas.reduce((s,t)=>s+Number(t.amount),0);
    const hasOverdue = items.some(t => t.status === 'previsto' && isPast);
    const saldoDia = entradasTotalDia - saidasTotalDia;
    const saldoAcum = saldoAcumuladoPorDia[day];
    const isFuture = dateStr > todayStr;

    cells += `
      <div class="cal-cell ${isToday ? 'cal-cell-today' : ''} ${items.length > 0 ? 'cal-cell-has-items' : ''}" onclick="${items.length > 0 ? `openDayDetailModal('${dateStr}')` : ''}">
        <div class="cal-cell-header">
          <span class="cal-cell-day">${day}</span>
          ${hasOverdue ? `<span class="cal-overdue-dot" title="Pendência em atraso"></span>` : ''}
        </div>
        ${entradasTotalDia > 0 ? `<div class="cal-amount cal-amount-in">+${formatMoneyCompact(entradasTotalDia)}</div>` : ''}
        ${saidasTotalDia > 0 ? `<div class="cal-amount cal-amount-out">−${formatMoneyCompact(saidasTotalDia)}</div>` : ''}
        <div class="cal-amount-saldo ${saldoAcum >= 0 ? 'cal-amount-in' : 'cal-amount-out'}"
          title="Saldo acumulado${isFuture ? ' projetado' : ''}: ${formatMoney(saldoAcum)}"
          style="font-size:10px; opacity:${items.length > 0 ? '1' : '0.5'};">
          ${isFuture ? '≈' : ''}${formatMoneyCompact(saldoAcum)}
        </div>
      </div>
    `;
  }

  const WEEKDAY_LABELS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

  return `
    ${overduePanel}
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap;">
      <div style="display:flex; align-items:center; gap:4px; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-sm); padding:4px;">
        <button class="btn btn-ghost btn-sm" onclick="shiftCalendarMonth(-1)" title="Mês anterior">‹</button>
        <span style="font-family:var(--font-display); font-weight:600; font-size:13px; padding:0 10px; min-width:140px; text-align:center;">
          ${MONTH_NAMES[month-1]} / ${year}
        </span>
        <button class="btn btn-ghost btn-sm" onclick="shiftCalendarMonth(1)" title="Próximo mês">›</button>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="calendarToToday()">Hoje</button>
      ${totalAtrasados > 0 ? `<span class="status-pill" style="background:var(--danger-soft); color:var(--danger);">⚠ ${totalAtrasados} pendência${totalAtrasados>1?'s':''} em atraso</span>` : ''}
    </div>

    <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; margin-bottom:18px;">

      <!-- ENTRADAS -->
      <div class="panel" style="border-top:3px solid var(--pj);">
        <div style="padding:10px 14px 4px; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--pj); font-weight:700;">Entradas</div>
        <div style="padding:0 14px 14px; display:flex; flex-direction:column; gap:10px;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div>
              <div style="font-size:10.5px; color:var(--text-faint);">Previstas no mês</div>
              <div class="amount" style="font-size:18px; color:var(--pj); font-weight:700;">${formatMoney(entradasTotal)}</div>
            </div>
            <span style="font-size:10px; background:var(--pj-soft); color:var(--pj); padding:2px 7px; border-radius:99px;">total</span>
          </div>
          <div style="border-top:1px dashed var(--border); padding-top:10px; display:flex; flex-direction:column; gap:7px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div style="font-size:11.5px; color:var(--text-dim);">✓ Recebidas</div>
              <div class="amount" style="font-size:13px; color:var(--pj); font-weight:600;">${formatMoney(entradasRealizadas)}</div>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div style="font-size:11.5px; color:var(--text-dim);">⏳ A receber</div>
              <div class="amount" style="font-size:13px; color:var(--warn); font-weight:600;">${formatMoney(entradasPrevistas)}</div>
            </div>
          </div>
          ${entradasTotal > 0 ? `
            <div style="background:var(--bg-elevated); border-radius:5px; height:5px; overflow:hidden;">
              <div style="background:var(--pj); width:${Math.min(100,(entradasRealizadas/entradasTotal)*100).toFixed(1)}%; height:100%; border-radius:5px;"></div>
            </div>
          ` : ''}
        </div>
      </div>

      <!-- SAÍDAS -->
      <div class="panel" style="border-top:3px solid var(--danger);">
        <div style="padding:10px 14px 4px; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--danger); font-weight:700;">Saídas</div>
        <div style="padding:0 14px 14px; display:flex; flex-direction:column; gap:10px;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div>
              <div style="font-size:10.5px; color:var(--text-faint);">Previstas no mês</div>
              <div class="amount" style="font-size:18px; color:var(--danger); font-weight:700;">${formatMoney(saidasTotal)}</div>
            </div>
            <span style="font-size:10px; background:var(--danger-soft); color:var(--danger); padding:2px 7px; border-radius:99px;">total</span>
          </div>
          <div style="border-top:1px dashed var(--border); padding-top:10px; display:flex; flex-direction:column; gap:7px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div style="font-size:11.5px; color:var(--text-dim);">✓ Pagas</div>
              <div class="amount" style="font-size:13px; color:var(--danger); font-weight:600;">${formatMoney(saidasRealizadas)}</div>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div style="font-size:11.5px; color:var(--text-dim);">⏳ A pagar</div>
              <div class="amount" style="font-size:13px; color:var(--warn); font-weight:600;">${formatMoney(saidasPrevistas)}</div>
            </div>
          </div>
          ${saidasTotal > 0 ? `
            <div style="background:var(--bg-elevated); border-radius:5px; height:5px; overflow:hidden;">
              <div style="background:var(--danger); width:${Math.min(100,(saidasRealizadas/saidasTotal)*100).toFixed(1)}%; height:100%; border-radius:5px;"></div>
            </div>
          ` : ''}
        </div>
      </div>

      <!-- SALDO -->
      <div class="panel" style="border-top:3px solid ${saldoTotal >= 0 ? 'var(--pj)' : 'var(--danger)'};">
        <div style="padding:10px 14px 4px; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:${saldoTotal >= 0 ? 'var(--pj)' : 'var(--danger)'}; font-weight:700;">Saldo</div>
        <div style="padding:0 14px 14px; display:flex; flex-direction:column; gap:10px;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div>
              <div style="font-size:10.5px; color:var(--text-faint);">Saldo projetado</div>
              <div class="amount" style="font-size:18px; color:${saldoTotal >= 0 ? 'var(--pj)' : 'var(--danger)'}; font-weight:700;">${formatMoney(saldoTotal)}</div>
            </div>
            <span style="font-size:10px; background:var(--bg-elevated); color:var(--text-faint); padding:2px 7px; border-radius:99px;">mês</span>
          </div>
          <div style="border-top:1px dashed var(--border); padding-top:10px; display:flex; flex-direction:column; gap:7px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div style="font-size:11.5px; color:var(--text-dim);">✓ Realizado</div>
              <div class="amount" style="font-size:13px; color:${saldoRealizado >= 0 ? 'var(--pj)' : 'var(--danger)'}; font-weight:600;">${formatMoney(saldoRealizado)}</div>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div style="font-size:11.5px; color:var(--text-dim);">⏳ A realizar</div>
              <div class="amount" style="font-size:13px; color:var(--warn); font-weight:600;">${formatMoney(saldoARealizarVal)}</div>
            </div>
          </div>
        </div>
      </div>

    </div>

    <div class="panel">
      <div class="cal-weekdays">
        ${WEEKDAY_LABELS.map(d => `<div class="cal-weekday">${d}</div>`).join('')}
      </div>
      <div class="cal-grid">
        ${cells}
      </div>
    </div>
  `;
}

function formatMoneyCompact(v){
  if (v >= 1000) return (v/1000).toLocaleString('pt-BR', {maximumFractionDigits:1}) + 'k';
  return v.toLocaleString('pt-BR', {maximumFractionDigits:0});
}

  const [y,m,d] = dateStr.split('-');

          </div>
          ${items.map(t => `

              <div style="min-width:0;">
                <div style="font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(t.description)}</div>

                  <span class="cat-pill">${escapeHtml(t.categories?.name || '—')}</span>

/* ============================================================
   TRANSFERÊNCIA ENTRE CONTAS
   Gera dois lançamentos espelhados (saída na origem, entrada no
   destino), linkados via mirror_transaction_id. Usa as categorias
   "Transferência Enviada" e "Transferência Recebida" que já
   existem no sistema — não entra em Receita/Custos da DRE.
   ============================================================ */
/* ============================================================
   PÁGINA: CARTÃO DE CRÉDITO
   Controle isolado — não integra com fluxo de caixa.
   Cada empresa tem seus próprios cartões.
   ============================================================ */
function getCardUsed(cardId){
  // Limite usado = todas as parcelas ainda não pagas (não só do mês atual)
  // pois cada compra parcelada compromete o limite até ser quitada integralmente
  return state.creditCardInstallments
    .filter(i => {
      const tx = state.creditCardTxs.find(t => t.id === i.transaction_id);
      return tx?.card_id === cardId && !i.paid;
    })
    .reduce((s,i) => s + Number(i.amount), 0);
}

function renderCartaoCredito(){
  const cards = state.creditCards;
  const [activeCardId, setActiveCard] = [
    window._activeCardId || cards[0]?.id,
    id => { window._activeCardId = id; render(); }
  ];
  const activeCard = cards.find(c => c.id === activeCardId) || cards[0];

  if (cards.length === 0){
    return `
      <div class="empty-state">
        <div class="empty-state-title">Nenhum cartão cadastrado</div>
        <div style="margin-top:12px;">
          <button class="btn btn-primary ${state.entityKind}" onclick="openCreditCardModal()">+ Cadastrar cartão</button>
        </div>
      </div>
    `;
  }

  const used = activeCard ? getCardUsed(activeCard.id) : 0;
  const available = activeCard ? Number(activeCard.limit_amount) - used : 0;

  // parcelas do cartão ativo agrupadas por mês de vencimento
  const txsOfCard = state.creditCardTxs.filter(t => t.card_id === activeCard?.id);
  const installsOfCard = state.creditCardInstallments.filter(i =>
    txsOfCard.some(t => t.id === i.transaction_id)
  ).sort((a,b) => a.due_date.localeCompare(b.due_date));

  // agrupa por mês
  const byMonth = {};
  installsOfCard.forEach(i => {
    const key = i.due_date.slice(0,7);
    if (!byMonth[key]) byMonth[key] = [];
    byMonth[key].push(i);
  });
  const monthKeys = Object.keys(byMonth).sort();

  return `
    <div style="display:flex; gap:8px; align-items:center; margin-bottom:18px; flex-wrap:wrap;">
      ${cards.map(c => `
        <button class="btn ${c.id === activeCard?.id ? `btn-primary ${state.entityKind}` : 'btn-ghost'} btn-sm" onclick="window._activeCardId='${c.id}'; render();">
          ${escapeHtml(c.name)}
        </button>
      `).join('')}
      <button class="btn btn-ghost btn-sm" onclick="openCreditCardModal()" style="margin-left:auto; border:1px solid var(--border);">+ Novo cartão</button>
    </div>

    ${activeCard ? `
      <div class="kpi-row" style="margin-bottom:18px;">
        <div class="kpi-card" style="cursor:pointer;" onclick="openCreditCardModal('${activeCard.id}')" title="Clique para editar">
          <div class="kpi-label">Limite total</div>
          <div class="kpi-value" style="color:var(--text);">${formatMoney(activeCard.limit_amount)}</div>
          <div class="kpi-sub">Fecha dia ${activeCard.closing_day || '—'} · Vence dia ${activeCard.due_day || '—'}</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Usado (parcelas em aberto)</div>
          <div class="kpi-value negative">${formatMoney(used)}</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Disponível</div>
          <div class="kpi-value ${available >= 0 ? 'positive' : 'negative'}">${formatMoney(available)}</div>
        </div>
      </div>

      ${monthKeys.length === 0 ? `
        <div class="empty-state">
          <div class="empty-state-title">Nenhum gasto lançado</div>
          <div>Clique em "+ Novo gasto" para começar.</div>
        </div>
      ` : monthKeys.map(mKey => {
        const [y,m] = mKey.split('-');
        const monthTotal = byMonth[mKey].reduce((s,i) => s + Number(i.amount), 0);
        const paidTotal = byMonth[mKey].filter(i => i.paid).reduce((s,i) => s + Number(i.amount), 0);
        return `
          <div class="panel" style="margin-bottom:14px;">
            <div class="panel-header">
              <div class="panel-title">${MONTH_NAMES[Number(m)-1]} / ${y}</div>
              <div style="display:flex; align-items:center; gap:12px;">
                <span style="font-size:12px; color:var(--text-faint);">Pago: ${formatMoney(paidTotal)} de ${formatMoney(monthTotal)}</span>
                <span class="cat-pill">${byMonth[mKey].length} parcela(s)</span>
              </div>
            </div>
            <table>
              <thead><tr><th>Descrição</th><th>Categoria</th><th>Parcela</th><th>Vencimento</th><th style="text-align:right;">Valor</th><th style="text-align:center;">Pago</th></tr></thead>
              <tbody>
                ${byMonth[mKey].map(inst => {
                  const tx = txsOfCard.find(t => t.id === inst.transaction_id);
                  return `
                    <tr style="cursor:pointer;" onclick="openCreditCardTxModal('${tx?.id}')">
                      <td>${escapeHtml(tx?.description || '—')}</td>
                      <td><span class="cat-pill">${escapeHtml(tx?.category || '—')}</span></td>
                      <td style="color:var(--text-faint); font-size:12px;">${inst.installment_number}/${tx?.installments}</td>
                      <td>${formatDate(inst.due_date)}</td>
                      <td class="amount out" style="text-align:right;">${formatMoney(inst.amount)}</td>
                      <td style="text-align:center;" onclick="event.stopPropagation();">
                        <input type="checkbox" ${inst.paid ? 'checked' : ''} onchange="toggleInstallmentPaid('${inst.id}', this.checked)" style="width:15px; height:15px; cursor:pointer;">
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;
      }).join('')}
    ` : ''}
  `;
}

async function submitCreditCardTx(editingId){
  const cardId = document.getElementById('ccTxCard').value;
  const desc = document.getElementById('ccTxDesc').value.trim();
  const amount = parseFloat(document.getElementById('ccTxAmount').value);
  const installments = parseInt(document.getElementById('ccTxInstallments').value) || 1;
  const firstDue = document.getElementById('ccTxFirstDue').value;
  const category = document.getElementById('ccTxCategory').value.trim();

  if (!desc) { toast('Informe a descrição.', 'error'); return; }
  if (!amount || amount <= 0) { toast('Informe o valor.', 'error'); return; }
  if (!firstDue) { toast('Informe o 1º vencimento.', 'error'); return; }

  const installAmt = Math.round((amount / installments) * 100) / 100;

  const payload = { card_id: cardId, description: desc, total_amount: amount, installments, installment_amount: installAmt, first_due_date: firstDue, category: category || null };

  try {
    if (editingId) {
      const { error } = await supabaseClient.from('credit_card_transactions').update(payload).eq('id', editingId);
      if (error) throw error;
      toast('Gasto atualizado.');
    } else {
      const { data: tx, error: txErr } = await supabaseClient.from('credit_card_transactions').insert(payload).select().single();
      if (txErr) throw txErr;

      // gera as parcelas
      const instRows = Array.from({ length: installments }, (_, i) => {
        const due = new Date(firstDue);
        due.setMonth(due.getMonth() + i);
        const isLast = i === installments - 1;
        const amt = isLast ? Math.round((amount - installAmt * (installments-1)) * 100)/100 : installAmt;
        return { transaction_id: tx.id, installment_number: i+1, amount: amt, due_date: due.toISOString().slice(0,10), paid: false };
      });
      const { error: instErr } = await supabaseClient.from('credit_card_installments').insert(instRows);
      if (instErr) throw instErr;
      toast(installments === 1 ? 'Gasto lançado.' : `Gasto parcelado em ${installments}x lançado.`);
    }
    closeModal();
    await loadCreditCards();
    render();
  } catch (err) { toast('Erro: ' + err.message, 'error'); }
}

async function setTransferType(type){
  window._transferType = type;
  document.querySelectorAll('#transferTypeToggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.type === type);
  });

  const note = document.getElementById('transferNote');
  const toHost = document.getElementById('tfToHost');

  if (type === 'interna') {
    const fromOptions = state.accounts.map(a => `<option value="${a.id}">${escapeHtml(a.name)}</option>`).join('');
    note.querySelector('span:last-child').textContent = 'Gera dois lançamentos espelhados: saída na conta de origem e entrada na conta de destino.';
    toHost.innerHTML = `<div class="field"><label for="tfTo">Conta de destino (entrada)</label><select id="tfTo">${fromOptions}</select></div>`;
  } else {
    note.querySelector('span:last-child').textContent = 'Gera saída na empresa/conta de origem e entrada na empresa/conta de destino. Cada empresa registra seu próprio lançamento.';
    // Carrega contas das outras empresas se ainda não carregou
    const otherEntities = state.entities.filter(e => e.id !== currentEntity()?.id && e.kind === 'pj');
    if (otherEntities.length === 0) { toast('Não há outras empresas no grupo.', 'error'); setTransferType('interna'); return; }

    await Promise.all(otherEntities.map(async ent => {
      const { data } = await supabaseClient.from('accounts').select('*').eq('entity_id', ent.id).eq('is_active', true);
      allAccounts[ent.id] = { entity: ent, accounts: data || [] };
    }));
    window._otherEntitiesAccounts = allAccounts;

    const toOptions = otherEntities.map(ent => {
      const accs = allAccounts[ent.id]?.accounts || [];
      return `<optgroup label="${escapeHtml(ent.name)}">${accs.map(a => `<option value="${a.id}|${ent.id}">${escapeHtml(a.name)}</option>`).join('')}</optgroup>`;
    }).join('');

        <label for="tfTo">Empresa e conta de destino (entrada)</label>
        <select id="tfTo">${toOptions}</select>
      </div>
    `;
  }
}

async function submitTransfer(){
  const entity = currentEntity();
  const amount = parseFloat(document.getElementById('tfAmount').value);
  const date = document.getElementById('tfDate').value;
  const fromId = document.getElementById('tfFrom').value;
  const toRaw = document.getElementById('tfTo').value;
  const desc = document.getElementById('tfDesc').value.trim() || 'Transferência entre contas';
  const type = window._transferType || 'interna';

  if (!amount || amount <= 0) { toast('Informe um valor válido.', 'error'); return; }
  if (!date) { toast('Informe a data.', 'error'); return; }

  const catEnviada = state.categories.find(c => c.name === 'Transferência Enviada');
  const catRecebida = state.categories.find(c => c.name === 'Transferência Recebida');
  if (!catEnviada || !catRecebida) { toast('Categorias de transferência não encontradas.', 'error'); return; }

  try {
    if (type === 'interna') {
      // mesma lógica de antes
      if (fromId === toRaw) { toast('Conta de origem e destino não podem ser iguais.', 'error'); return; }

      const { data: txSaida, error: e1 } = await supabaseClient.from('transactions').insert({
        entity_id: entity.id, account_id: fromId, category_id: catEnviada.id,
        description: desc, amount, flow_type: 'saida',
        date_competencia: date, date_realizado: date, status: 'realizado', source: 'manual'
      }).select().single();
      if (e1) throw e1;

      const { data: txEntrada, error: e2 } = await supabaseClient.from('transactions').insert({
        entity_id: entity.id, account_id: toRaw, category_id: catRecebida.id,
        description: desc, amount, flow_type: 'entrada',
        date_competencia: date, date_realizado: date, status: 'realizado', source: 'manual',
        mirror_transaction_id: txSaida.id
      }).select().single();
      if (e2) throw e2;

      await supabaseClient.from('transactions').update({ mirror_transaction_id: txEntrada.id }).eq('id', txSaida.id);

      const fromName = state.accounts.find(a => a.id === fromId)?.name || '';
      const toName = state.accounts.find(a => a.id === toRaw)?.name || '';
      toast(`Transferência de ${formatMoney(amount)} registrada: ${fromName} → ${toName}`);

    } else {
      // entre empresas
      const [toAccountId, toEntityId] = toRaw.split('|');
      const toEntityData = window._otherEntitiesAccounts[toEntityId];
      const toEntity = toEntityData?.entity;

      if (!toEntity) { toast('Empresa de destino não encontrada.', 'error'); return; }

      // busca categoria de transferência recebida da empresa de destino
      const { data: toGroups } = await supabaseClient.from('groups').select('*, categories(*)').eq('entity_id', toEntityId);
      const toCats = (toGroups || []).flatMap(g => g.categories || []);
      const toCatRecebida = toCats.find(c => c.name === 'Transferência Recebida');
      const toCatEnviada = toCats.find(c => c.name === 'Transferência Enviada');

      // lançamento de SAÍDA na empresa de origem
      const { data: txSaida, error: e1 } = await supabaseClient.from('transactions').insert({
        entity_id: entity.id, account_id: fromId, category_id: catEnviada.id,
        description: `${desc} → ${toEntity.name}`, amount, flow_type: 'saida',
        date_competencia: date, date_realizado: date, status: 'realizado', source: 'manual'
      }).select().single();
      if (e1) throw e1;

      // lançamento de ENTRADA na empresa de destino
      const { data: txEntrada, error: e2 } = await supabaseClient.from('transactions').insert({
        entity_id: toEntityId, account_id: toAccountId,
        category_id: toCatRecebida?.id || null,
        description: `${desc} ← ${entity.name}`, amount, flow_type: 'entrada',
        date_competencia: date, date_realizado: date, status: 'realizado', source: 'manual',
        mirror_transaction_id: txSaida.id
      }).select().single();
      if (e2) throw e2;

      await supabaseClient.from('transactions').update({ mirror_transaction_id: txEntrada.id }).eq('id', txSaida.id);

      const fromName = state.accounts.find(a => a.id === fromId)?.name || '';
      const toName = toEntityData?.accounts?.find(a => a.id === toAccountId)?.name || '';
      toast(`Transferência de ${formatMoney(amount)} registrada: ${entity.name}/${fromName} → ${toEntity.name}/${toName}`);
    }

    closeModal();
    await loadEntityData();
    render();
  } catch (err) {
    console.error(err);
    toast('Erro ao registrar transferência: ' + err.message, 'error');
  }
}

/* ============================================================
   PARSER OFX — formato SGML (não-XML estrito), tags abertas sem
   fechamento obrigatório. Extrai cada bloco <STMTTRN>...</STMTTRN>.
   ============================================================ */
function parseOfx(text){
  const transactions = [];
  const blocks = text.split('<STMTTRN>').slice(1);

  for (const block of blocks) {
    const get = (tag) => {
      const m = block.match(new RegExp(`<${tag}>([^<\\r\\n]*)`));
      return m ? m[1].trim() : null;
    };

    const trnType = get('TRNTYPE');
    const dtPosted = get('DTPOSTED');
    const amountRaw = get('TRNAMT');
    const fitId = get('FITID');
    const memo = get('MEMO') || get('NAME') || '(sem descrição)';

    if (!dtPosted || amountRaw === null) continue;

    // DTPOSTED formato: 20260406080501[-3:BRT] -> pega só os 8 primeiros dígitos (YYYYMMDD)
    const y = dtPosted.slice(0,4), m = dtPosted.slice(4,6), d = dtPosted.slice(6,8);
    const date = `${y}-${m}-${d}`;

    const amount = parseFloat(amountRaw);
    const flow_type = amount >= 0 ? 'entrada' : 'saida';

    transactions.push({
      fitId,
      date,
      amount: Math.abs(amount),
      flow_type,
      memo: memo.replace(/\s+/g,' ').trim(),
      trnType
    });
  }
  return transactions;
}

/* Sugestão automática de categoria por palavras-chave no MEMO,
   baseada nos padrões reais observados na planilha do Lorimar. */
const CATEGORY_KEYWORDS = [
  { match: /transf enviada pix|transf\.? enviada/i, groupHint: 'Transferência Enviada', catHint: 'Transferência Enviada' },
  { match: /transf recebida|transferencia recebida/i, groupHint: 'Transferência Recebida', catHint: 'Transferência Recebida' },
  { match: /posto|combust[ií]vel/i, catHint: 'Combustível' },
  { match: /uber|99|estacionamento/i, catHint: 'Transporte' },
  { match: /supermercado|hippo|komprão|bistek|mercado/i, catHint: 'Mercado' },
  { match: /ifood|restaurante|lanch|pizz|burguer|hamburg|padaria/i, catHint: 'Alimentação' },
  { match: /fatura de cart[ãa]o|cart[ãa]o de cr[ée]dito/i, catHint: 'Cartão de crédito' },
  { match: /energia|celesc/i, catHint: 'Energia Elétrica' },
  { match: /pix recebido/i, catHint: null }, // entrada — deixa em aberto, usuário escolhe receita
  { match: /pró-?labore/i, catHint: 'Pró-labore' },
  { match: /contabilidade/i, catHint: 'Contabilidade' },
  { match: /simples nacional/i, catHint: 'Simples Nacional' },
];

function suggestCategory(memo, flowType){
  for (const rule of CATEGORY_KEYWORDS) {
    if (rule.match.test(memo)) return rule.catHint;
  }
  return null;
}

function findCategoryByName(name){
  if (!name) return null;
  for (const g of state.groups) {
    const cat = (g.categories || []).find(c => c.name.toLowerCase() === name.toLowerCase());
    if (cat) return { categoryId: cat.id, groupId: g.id };
  }
  return null;
}

/* ============================================================
   HANDLER: arquivo OFX selecionado
   ============================================================ */
async function handleOfxFile(event){
  const file = event.target.files[0];
  if (!file) return;

  const statusEl = document.getElementById('ofxStatus');
  statusEl.textContent = 'Lendo arquivo…';

  const text = await file.text();
  let parsed;
  try {
    parsed = parseOfx(text);
  } catch (err) {
    statusEl.textContent = 'Erro ao ler o arquivo: ' + err.message;
    return;
  }

  if (parsed.length === 0) {
    statusEl.textContent = 'Nenhuma transação encontrada nesse arquivo.';
    return;
  }

  statusEl.textContent = `${parsed.length} transações encontradas. Cruzando com lançamentos existentes…`;

  // 1) separa o que já foi importado antes (mesmo FITID já salvo no banco)
  const existingFitIds = new Set(state.transactions.filter(t => t.ofx_fitid).map(t => t.ofx_fitid));
  const aguardando = state.transactions.filter(t => t.reconciliation_status === 'aguardando');

  const rows = parsed.map(tx => {
    if (existingFitIds.has(tx.fitId)) {
      return { ...tx, action: 'skip', reason: 'Já importado anteriormente' };
    }

    // 2) tenta achar par entre os "aguardando conciliação" (espelhos de pró-labore)
    const match = aguardando.find(t =>
      t.flow_type === tx.flow_type &&
      Math.abs(Number(t.amount) - tx.amount) < 0.01 &&
      Math.abs(daysBetween(t.date_competencia, tx.date)) <= 3
    );
    if (match) {
      return { ...tx, action: 'reconcile', matchId: match.id, reason: `Concilia com "${match.description}" (aguardando)` };
    }

    // 3) novo lançamento — sugere categoria
    const catName = suggestCategory(tx.memo, tx.flow_type);
    const found = findCategoryByName(catName);
    return { ...tx, action: 'create', suggestedCategoryId: found?.categoryId || null, suggestedCategoryName: catName };
  });

  statusEl.textContent = `${rows.length} transações prontas para revisão.`;
  window._ofxRows = rows;
  renderOfxPreview(rows);
}

function daysBetween(d1, d2){
  const a = new Date(d1), b = new Date(d2);
  return Math.round((b - a) / (1000*60*60*24));
}

      <td class="amount ${r.flow_type === 'entrada' ? 'in' : 'out'}" style="text-align:right;">

/* ============================================================
   CONFIRMAÇÃO: grava no banco (reconciliações + novos lançamentos)
   ============================================================ */
async function confirmOfxImport(){
  // Trava o botão imediatamente pra evitar duplo clique
  const btn = document.querySelector('#ofxPreviewHost .btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = 'Processando…'; }

  const rows = window._ofxRows || [];
  const entity = currentEntity();
  const accountId = document.getElementById('ofxAccount')?.value || null;

  const toReconcile = rows.filter(r => r.action === 'reconcile');
  const toCreate = rows.filter(r => r.action === 'create' && r.suggestedCategoryId);
  const skippedNoCategory = rows.filter(r => r.action === 'create' && !r.suggestedCategoryId).length;

  let reconciled = 0, created = 0, failed = 0;

  try {
    // Reconciliações: ainda uma por uma (cada uma precisa de um .eq() diferente)
    // mas em paralelo com Promise.all — muito mais rápido que sequencial
    const reconcileResults = await Promise.all(
      toReconcile.map(r =>
        supabaseClient.from('transactions').update({
          reconciliation_status: 'conciliado',
          status: 'realizado',
          date_realizado: r.date,
          ofx_fitid: r.fitId,
          source: 'ofx'
        }).eq('id', r.matchId)
      )
    );
    reconcileResults.forEach(({ error }) => {
      if (error) { failed++; console.error(error); } else { reconciled++; }
    });

    // Criações: insert em LOTE (uma única chamada pra todas as linhas)
    // muito mais rápido que N inserts sequenciais
    if (toCreate.length > 0) {
      const payload = toCreate.map(r => ({
        entity_id: entity.id,
        account_id: accountId,
        category_id: r.suggestedCategoryId,
        description: r.memo,
        amount: r.amount,
        flow_type: r.flow_type,
        date_competencia: r.date,
        date_realizado: r.date,
        status: 'realizado',
        source: 'ofx',
        ofx_fitid: r.fitId,
        reconciliation_status: 'conciliado'
      }));
      const { error } = await supabaseClient.from('transactions').insert(payload);
      if (error) { failed += toCreate.length; console.error(error); }
      else { created = toCreate.length; }
    }

    await supabaseClient.from('ofx_imports').insert({
      entity_id: entity.id,
      account_id: accountId,
      file_name: document.getElementById('ofxFile')?.files?.[0]?.name || null,
      imported_count: created,
      matched_count: reconciled
    });

    let msg = `Importação concluída: ${reconciled} conciliadas, ${created} novas.`;
    if (skippedNoCategory > 0) msg += ` ${skippedNoCategory} sem categoria ignoradas.`;
    if (failed > 0) msg += ` ${failed} falharam.`;
    toast(msg, failed > 0 ? 'warn' : '');

    window._ofxRows = null;
    document.getElementById('ofxPreviewHost').innerHTML = '';
    document.getElementById('ofxFile').value = '';
    await loadEntityData();
    render();

  } catch (err) {
    console.error(err);
    toast('Erro na importação: ' + err.message, 'error');
    if (btn) { btn.disabled = false; btn.textContent = 'Confirmar importação'; }
  }
}

/* ============================================================
   PÁGINA: OBJETIVOS (metas de consumo/poupança)
   Organizados em quadrantes por prazo (recalculado pela data de
   hoje, sem precisar mover manualmente): 0-3, 3-6, 6-9, 9-12 e
   12+ meses. Concluídos (evolução >= valor total) ficam à parte.
   Evolução é sempre atualizada manualmente.
   ============================================================ */
function monthsUntil(dateStr){
  const today = new Date();
  const due = new Date(dateStr + 'T00:00:00');
  const diffDays = (due - today) / (1000*60*60*24);
  return diffDays / 30.44; // média de dias por mês
}

function renderObjetivos(){
  const goals = state.goals;
  const f = window._goalFilters || {};

  // KPIs consolidados (todos os objetivos, sem filtro)
  const totalMeta    = goals.reduce((s,g) => s + Number(g.target_amount), 0);
  const totalGuardado = goals.reduce((s,g) => s + Number(g.current_amount), 0);
  const totalFalta   = Math.max(0, totalMeta - totalGuardado);
  const pctGeral     = totalMeta > 0 ? Math.min(100, (totalGuardado / totalMeta) * 100) : 0;

  const today = new Date().toISOString().slice(0,10);
  const concluded = goals.filter(g => Number(g.current_amount) >= Number(g.target_amount));
  const overdue   = goals.filter(g => Number(g.current_amount) < Number(g.target_amount) && g.due_date < today);
  const active    = goals.filter(g => Number(g.current_amount) < Number(g.target_amount) && g.due_date >= today);

  // aplica filtros
  const filterStatus = f.status || '';
  const filterPrazo  = f.prazo  || '';

  const QUADRANTS = [
    { key: '0-3',   label: '0–3 meses',        test: m => m <= 3 },
    { key: '3-6',   label: '3–6 meses',         test: m => m > 3 && m <= 6 },
    { key: '6-12',  label: '6–12 meses',        test: m => m > 6 && m <= 12 },
    { key: '12+',   label: 'Longo prazo (12m+)', test: m => m > 12 },
  ];

  // filtra por status
  let filtered = [...goals];
  if (filterStatus === 'concluido') filtered = concluded;
  else if (filterStatus === 'atrasado') filtered = overdue;
  else if (filterStatus === 'andamento') filtered = active;

  // filtra por prazo
  const goalsWithMonths = filtered.map(g => ({ goal: g, months: monthsUntil(g.due_date) }));
  const filteredByPrazo = filterPrazo
    ? goalsWithMonths.filter(x => QUADRANTS.find(q => q.key === filterPrazo)?.test(x.months))
    : goalsWithMonths;

  const activeFiltered    = filteredByPrazo.filter(x => Number(x.goal.current_amount) < Number(x.goal.target_amount) && x.goal.due_date >= today);
  const concludedFiltered = filteredByPrazo.filter(x => Number(x.goal.current_amount) >= Number(x.goal.target_amount));
  const overdueFiltered   = filteredByPrazo.filter(x => Number(x.goal.current_amount) < Number(x.goal.target_amount) && x.goal.due_date < today);

  const hasFilter = filterStatus || filterPrazo;

  if (goals.length === 0) return `
    <div class="empty-state">
      <div class="empty-state-title">Nenhum objetivo cadastrado</div>
      <div>Clique em "+ Novo objetivo" para começar.</div>
    </div>
  `;

  return `
    <!-- KPIs consolidados -->
    <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px;">
      <div class="kpi-card">
        <div class="kpi-label">Meta total</div>
        <div class="kpi-value" style="color:var(--text);">${formatMoney(totalMeta)}</div>
        <div class="kpi-sub">${goals.length} objetivo${goals.length>1?'s':''}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Já guardado</div>
        <div class="kpi-value positive">${formatMoney(totalGuardado)}</div>
        <div class="kpi-sub">${pctGeral.toFixed(1)}% da meta total</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Falta guardar</div>
        <div class="kpi-value" style="color:var(--warn);">${formatMoney(totalFalta)}</div>
        <div class="kpi-sub">${(100-pctGeral).toFixed(1)}% restante</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Progresso geral</div>
        <div class="kpi-value ${pctGeral >= 100 ? 'positive' : ''}" style="${pctGeral < 100 ? 'color:var(--text);' : ''}">${pctGeral.toFixed(1)}%</div>
        <div style="margin-top:6px; background:var(--bg-elevated); border-radius:5px; height:5px; overflow:hidden;">
          <div style="background:var(--pj); width:${pctGeral.toFixed(1)}%; height:100%; border-radius:5px; transition:width .4s ease;"></div>
        </div>
      </div>
    </div>

    <!-- Badges de status -->
    <div style="display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; align-items:center;">
      <span style="font-size:12px; color:var(--text-faint);">Status:</span>
      ${[
        { key:'', label:'Todos', count: goals.length },
        { key:'andamento', label:'Em andamento', count: active.length },
        { key:'atrasado', label:'Atrasados', count: overdue.length },
        { key:'concluido', label:'Concluídos', count: concluded.length },
      ].map(s => `
        <button onclick="setGoalFilter('status','${s.key}')"
          class="btn btn-sm ${filterStatus === s.key ? 'btn-primary pj' : 'btn-ghost'}"
          style="font-size:11.5px; padding:4px 10px; ${s.key==='atrasado' && s.count>0 ? 'border-color:var(--danger); color:var(--danger);' : ''}">
          ${s.label} <span class="cat-pill" style="margin-left:4px;">${s.count}</span>
        </button>
      `).join('')}

      <span style="font-size:12px; color:var(--text-faint); margin-left:8px;">Prazo:</span>
      ${[
        { key:'', label:'Todos' },
        ...QUADRANTS.map(q => ({ key: q.key, label: q.label }))
      ].map(p => `
        <button onclick="setGoalFilter('prazo','${p.key}')"
          class="btn btn-sm ${filterPrazo === p.key ? 'btn-primary pj' : 'btn-ghost'}"
          style="font-size:11.5px; padding:4px 10px;">
          ${p.label}
        </button>
      `).join('')}

      ${hasFilter ? `<button onclick="clearGoalFilters()" class="btn btn-ghost btn-sm" style="margin-left:auto; border:1px solid var(--border);">✕ Limpar</button>` : ''}
    </div>

    <!-- Kanban por prazo -->
    ${activeFiltered.length + overdueFiltered.length > 0 ? `
      <div class="kanban-board" style="grid-template-columns:repeat(${filterPrazo ? '1' : QUADRANTS.length}, minmax(190px, 1fr));">
        ${(filterPrazo ? [QUADRANTS.find(q => q.key === filterPrazo)] : QUADRANTS).map(q => {
          const items = activeFiltered.filter(x => q.test(x.months)).sort((a,b) => a.months - b.months);
          const late   = overdueFiltered.filter(x => q.test(x.months));
          const all    = [...late, ...items];
          const colTarget  = all.reduce((s,x) => s + Number(x.goal.target_amount), 0);
          const colCurrent = all.reduce((s,x) => s + Number(x.goal.current_amount), 0);
          return `
            <div class="kanban-column">
              <div class="kanban-column-header" style="border-top:3px solid var(--pj); flex-direction:column; align-items:stretch; gap:8px;">
                <div style="display:flex; align-items:center; justify-content:space-between;">

                  <div class="goal-column-summary">
                    <div class="goal-summary-row"><span>Meta</span><span class="amount">${formatMoney(colTarget)}</span></div>
                    <div class="goal-summary-row"><span>Guardado</span><span class="amount in">${formatMoney(colCurrent)}</span></div>
                    <div class="goal-summary-row"><span>Falta</span><span class="amount out">${formatMoney(colTarget - colCurrent)}</span></div>
                  </div>
                ` : ''}
              </div>
              <div class="kanban-column-body">
                ${all.length === 0 ? `<div class="kanban-empty">Nenhum objetivo nesse prazo</div>` : all.map(x => renderGoalCard(x.goal)).join('')}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    ` : `<div class="empty-state"><div class="empty-state-title">Nenhum objetivo nesse filtro</div></div>`}

    <!-- Concluídos -->
    ${concludedFiltered.length > 0 ? `
      <div class="panel" style="margin-top:18px;">
        <div class="panel-header">
          <div class="panel-title">✓ Concluídos</div>

          ${concludedFiltered.map(x => renderGoalCard(x.goal, true)).join('')}
        </div>
      </div>
    ` : ''}
  `;
}

/* ============================================================
   PÁGINA: FATURAMENTO (vendas/propostas + parcelamento)
   ============================================================ */
const SALE_STATUS_LABELS = { proposta: 'Proposta', fechada: 'Fechada', cancelada: 'Cancelada' };
const SALE_STATUS_CLASS = { proposta: 'aguardando', fechada: 'realizado', cancelada: 'previsto' };

/* Vendas filtradas pelo período ativo, usando date_competencia (mesmo padrão de filteredTransactions) */
function filteredSales(){
  if (!state.period) return state.sales;
  const { year, month } = state.period;
  return state.sales.filter(s => {
    if (!s.date_competencia) return false;
    const [y, m] = s.date_competencia.split('-').map(Number);
    return y === year && m === month;
  });
}

/* ============================================================
   ANÁLISE: Conversão Faturamento → Caixa
   Baseado no histórico de TODAS as vendas fechadas (não só o
   período filtrado — é uma característica do negócio, igual a
   média móvel do Ponto de Equilíbrio). Calcula:
   - parcelamento médio (quantas parcelas as vendas costumam ter)
   - % médio do valor total que entra no primeiro vencimento
   ============================================================ */
function computeFaturamentoCaixaConversion(){
  const fechadas = state.sales.filter(s => s.status === 'fechada' && (s.sale_installments || []).length > 0);
  if (fechadas.length === 0) return null;

  let totalInstallmentCount = 0;
  let totalFirstPct = 0;
  let countWithValidFirst = 0;

  fechadas.forEach(sale => {
    const installments = [...(sale.sale_installments || [])].sort((a,b) => a.installment_number - b.installment_number);
    totalInstallmentCount += installments.length;

    const total = Number(sale.total_amount);
    if (total > 0 && installments.length > 0) {
      const first = Number(installments[0].amount);
      totalFirstPct += (first / total) * 100;
      countWithValidFirst++;
    }
  });

  const avgInstallments = totalInstallmentCount / fechadas.length;
  const avgFirstPct = countWithValidFirst > 0 ? totalFirstPct / countWithValidFirst : 0;

  return {
    salesCount: fechadas.length,
    avgInstallments,
    avgFirstPct,
  };
}

/* ============================================================
   SIMULADOR: "Quanto preciso faturar?"
   Faturamento Necessário = Receita Desejada ÷ (% médio do 1º vencimento)
   Compara com o Ponto de Equilíbrio em competência, usando o
   faturamento necessário recalculado como base do EBIT projetado.
   ============================================================ */
window._goalDesiredRevenue = null;

function renderGoalSimulatorPanel(conversion){
  if (conversion.avgFirstPct <= 0) {
    return `
      <div class="panel" style="margin-bottom:18px;">
        <div class="panel-header"><div class="panel-title">Quanto preciso faturar?</div></div>
        <div class="empty-state">
