<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grupo PGN Participações — Sistema Financeiro</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Sistema financeiro interno — Grupo PGN Participações Ltda.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
/* ============================================================
   DESIGN TOKENS — dois temas via [data-theme]
   Conceito: "Duas contas, uma verdade."
   PF = terracota · PJ = verde institucional
   Travessias entre as duas ganham tratamento visual próprio.

   Tema escuro: saturação um pouco mais alta que a versão original,
   mantendo conforto visual em uso prolongado.
   Tema claro: cores mais vivas e saturadas — funcionam melhor
   sobre fundo claro sem o efeito "neon"/halação do fundo escuro.
   ============================================================ */
:root,
[data-theme="dark"]{
  --bg: #0F1117;
  --bg-elevated: #161920;
  --bg-card: #1C2028;
  --border: #272B36;
  --text: #ECEAE4;
  --text-dim: #8E92A0;
  --text-faint: #52576A;

  --pf: #E8895A;
  --pf-soft: #E8895A22;
  --pj: #3DB87F;
  --pj-soft: #3DB87F22;

  --warn: #F0B840;
  --warn-soft: #F0B84022;
  --danger: #E06055;
  --danger-soft: #E0605522;
  --ok: #3DB87F;

  --shadow-color: #00000055;

  /* extras só no tema escuro */
  --glow-pj: 0 0 18px #3DB87F30;
  --glow-danger: 0 0 18px #E0605530;
  --sidebar-gradient: linear-gradient(180deg, #1A1E2A 0%, #131620 100%);
  --card-shine: inset 0 1px 0 #FFFFFF08;
}

[data-theme="light"]{
  --bg: #FAF8F5;
  --bg-elevated: #FFFFFF;
  --bg-card: #FFFFFF;
  --border: #E4E0D8;
  --text: #2A2620;
  --text-dim: #6B6658;
  --text-faint: #A39E90;

  --pf: #C8602B;
  --pf-soft: #C8602B1A;
  --pj: #1F8A5F;
  --pj-soft: #1F8A5F1A;

  --warn: #C5891A;
  --warn-soft: #C5891A1A;
  --danger: #C84432;
  --danger-soft: #C844321A;
  --ok: #1F8A5F;

  --shadow-color: #00000018;
}

:root{
  --font-display: 'Space Grotesk', sans-serif;
  --font-body: 'Inter', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;

  --radius: 10px;
  --radius-sm: 6px;
}

*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

::selection{ background: var(--pj-soft); }

/* ===== Vida ao tema escuro ===== */
[data-theme="dark"] .sidebar{
  background: linear-gradient(180deg, #0F1520 0%, #0B1018 100%);
  border-right-color: #1A2035;
}
[data-theme="dark"] .brand{
  background: linear-gradient(90deg, #4A7FBF, #7AAAD4);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
[data-theme="dark"] .kpi-card,
[data-theme="dark"] .panel{
  box-shadow: var(--card-shine), 0 2px 12px #00000030;
}
[data-theme="dark"] .kpi-value.positive{
  text-shadow: var(--glow-pj);
}
[data-theme="dark"] .kpi-value.negative{
  text-shadow: var(--glow-danger);
}
[data-theme="dark"] .btn-primary.pj{
  background: linear-gradient(135deg, var(--pj), #2EA06C);
  box-shadow: 0 2px 10px #3DB87F35;
  border-color: transparent;
}
[data-theme="dark"] .btn-primary.pj:hover{
  box-shadow: 0 4px 16px #3DB87F50;
  filter: brightness(1.1);
}
[data-theme="dark"] .nav-item.active{
  background: linear-gradient(90deg, var(--pj-soft), transparent);
  border-left: 2px solid var(--pj);
  padding-left: 8px;
}
[data-theme="dark"] .topbar{
  background: linear-gradient(90deg, #0B1018, #0F1520);
  border-bottom-color: #1A2035;
}
[data-theme="dark"] ::-webkit-scrollbar-thumb{
  background: #1E3050;
}
[data-theme="dark"] ::-webkit-scrollbar-thumb:hover{
  background: #2952A3;
}
[data-theme="dark"] input:focus,
[data-theme="dark"] select:focus,
[data-theme="dark"] textarea:focus{
  border-color: #2952A3 !important;
  box-shadow: 0 0 0 3px #2952A318;
  outline: none;
}
[data-theme="dark"] .cal-cell-today{
  background: linear-gradient(135deg, #1A2535, #131C2E);
  box-shadow: inset 0 0 0 1px #2952A340;
}
[data-theme="dark"] .status-pill.realizado{
  background: #1A2535;
  color: #7AAAD4;
  border: 1px solid #2952A330;
}
[data-theme="dark"] .amount.in{ text-shadow: 0 0 12px #3DB87F25; }
[data-theme="dark"] .panel-header{
  border-bottom-color: #1A2035;
  background: linear-gradient(90deg, #12192A, #0F1520);
}
/* Nav dot com azul PGN */
[data-theme="dark"] .nav-item.active .nav-dot{
  background: #4A7FBF;
  box-shadow: 0 0 6px #4A7FBF80;
}
/* Textos do menu mais legíveis sobre o fundo azul marinho */
[data-theme="dark"] .nav-item{
  color: #A8B4C8;
}
[data-theme="dark"] .nav-item:hover{
  color: #E8EDF5;
  background: #1A2540;
}
[data-theme="dark"] .nav-item.active{
  color: #E8EDF5;
}
[data-theme="dark"] .nav-label{
  color: #6A7A96;
}
[data-theme="dark"] .nav-label:hover{
  color: #A8B4C8;
  background: #1A2540;
}
[data-theme="dark"] .sidebar-footer{
  color: #5A6A84;
  border-top-color: #1A2540;
}

button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ===== App shell ===== */
#app{ display:flex; min-height:100vh; }

/* ===== Sidebar ===== */
.sidebar{
  width:240px;
  flex-shrink:0;
  background:var(--bg-elevated);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  padding:24px 16px;
  position:sticky;
  top:0;
  height:100vh;
  transition:width .2s ease, padding .2s ease, opacity .15s ease;
  overflow:hidden;
}
.sidebar.collapsed{
  width:0;
  padding:0;
  opacity:0;
  border-right:none;
}
.sidebar-toggle{
  position:fixed;
  top:14px;
  left:12px;
  z-index:100;
  width:28px;
  height:28px;
  border-radius:var(--radius-sm);
  background:var(--bg-elevated);
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:14px;
  color:var(--text-dim);
  transition:left .2s ease, background .15s ease;
  line-height:1;
}
.sidebar.collapsed ~ * .sidebar-toggle,
#sidebarToggleBtn.shifted{ left:12px; }
.sidebar-toggle:hover{ background:var(--bg-card); color:var(--text); }
.brand{
  font-family:var(--font-display);
  font-weight:700;
  font-size:17px;
  letter-spacing:-0.01em;
  margin-bottom:4px;
}
.brand-sub{
  font-size:11px;
  color:var(--text-faint);
  margin-bottom:28px;
  text-transform:uppercase;
  letter-spacing:0.06em;
}

/* Switch físico PF/PJ — a decisão mais importante da sessão */
.entity-switch{
  display:flex;
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:4px;
  margin-bottom:24px;
  position:relative;
}
.entity-switch button{
  flex:1;
  background:none;
  border:none;
  color:var(--text-dim);
  font-family:var(--font-display);
  font-weight:600;
  font-size:12.5px;
  padding:10px 8px;
  border-radius:7px;
  transition:color .2s ease;
  position:relative;
  z-index:1;
}
.entity-switch .thumb{
  position:absolute;
  top:4px; left:4px;
  width:calc(50% - 4px);
  height:calc(100% - 8px);
  border-radius:7px;
  transition:transform .25s cubic-bezier(.4,0,.2,1), background .25s ease;
  z-index:0;
}
.entity-switch.is-pf .thumb{ background:var(--pf-soft); border:1px solid var(--pf); transform:translateX(0); }
.entity-switch.is-pj .thumb{ background:var(--pj-soft); border:1px solid var(--pj); transform:translateX(100%); }
.entity-switch.is-pf button[data-entity="pf"]{ color:var(--pf); }
.entity-switch.is-pj button[data-entity="pj"]{ color:var(--pj); }

.nav-group{ margin-bottom:4px; }
.nav-label{
  font-size:10.5px;
  text-transform:uppercase;
  letter-spacing:0.08em;
  color:var(--text-faint);
  padding:5px 10px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-radius:var(--radius-sm);
  transition:background .15s;
  user-select:none;
}
.nav-label:hover{ background:var(--bg-card); color:var(--text-dim); }
.nav-label-arrow{
  font-size:9px;
  transition:transform .2s ease;
  opacity:.6;
}
.nav-group.collapsed .nav-label-arrow{ transform:rotate(-90deg); }
.nav-group-items{
  overflow:hidden;
  max-height:400px;
  transition:max-height .25s ease, opacity .2s ease;
  opacity:1;
}
.nav-group.collapsed .nav-group-items{
  max-height:0;
  opacity:0;
}
.nav-item{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  background:none;
  border:none;
  color:var(--text-dim);
  text-align:left;
  padding:9px 10px;
  border-radius:var(--radius-sm);
  font-size:13.5px;
  font-weight:500;
  transition:background .15s ease, color .15s ease;
}
.nav-item:hover{ background:var(--bg-card); color:var(--text); }
.nav-item.active{
  background:var(--bg-card);
  color:var(--text);
}
.nav-item.active .nav-dot{ opacity:1; }
.nav-dot{
  width:6px; height:6px; border-radius:50%;
  background:currentColor;
  opacity:0;
  flex-shrink:0;
}
.entity-switch.is-pf ~ .nav-content .nav-item.active{ color:var(--pf); }
.entity-switch.is-pj ~ .nav-content .nav-item.active{ color:var(--pj); }

.sidebar-footer{
  margin-top:auto;
  padding-top:16px;
  border-top:1px solid var(--border);
  font-size:11.5px;
  color:var(--text-faint);
}
.sync-dot{
  display:inline-block; width:6px; height:6px; border-radius:50%;
  background:var(--ok); margin-right:6px;
}
.theme-toggle{
  display:flex; align-items:center; gap:8px;
  width:100%;
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:8px 10px;
  color:var(--text-dim);
  font-size:12.5px;
  font-weight:500;
  transition:background .15s ease, color .15s ease;
}
.theme-toggle:hover{ background:var(--bg-elevated); color:var(--text); }
.theme-toggle #themeIcon{ font-size:13px; }

/* ===== Main ===== */
.main{ flex:1; min-width:0; display:flex; flex-direction:column; }
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:20px 32px;
  border-bottom:1px solid var(--border);
  background:var(--bg-elevated);
}
.page-title{
  font-family:var(--font-display);
  font-weight:600;
  font-size:20px;
}
.entity-badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:11px;
  font-weight:600;
  padding:4px 10px;
  border-radius:99px;
  margin-left:10px;
  vertical-align:middle;
  text-transform:uppercase;
  letter-spacing:.04em;
}
.entity-badge.pf{ background:var(--pf-soft); color:var(--pf); border:1px solid var(--pf); }
.entity-badge.pj{ background:var(--pj-soft); color:var(--pj); border:1px solid var(--pj); }

.topbar-actions{ display:flex; gap:10px; }

.btn{
  display:inline-flex; align-items:center; gap:7px;
  border-radius:var(--radius-sm);
  padding:9px 14px;
  font-size:13px;
  font-weight:600;
  border:1px solid var(--border);
  background:var(--bg-card);
  color:var(--text);
  transition:filter .15s ease, transform .1s ease;
}
.btn:hover{ filter:brightness(1.15); }
.btn:active{ transform:scale(.98); }
.btn-primary.pf{ background:var(--pf); border-color:var(--pf); color:#1A1410; }
.btn-primary.pj{ background:var(--pj); border-color:var(--pj); color:#0E1A16; }
.btn-ghost{ background:none; border-color:transparent; color:var(--text-dim); }
.btn-ghost:hover{ background:var(--bg-card); color:var(--text); }
.btn-sm{ padding:6px 10px; font-size:12px; }

.content{ flex:1; padding:28px 32px; overflow-y:auto; }

/* ===== Cards / KPIs ===== */
.kpi-row{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(190px, 1fr));
  gap:14px;
  margin-bottom:24px;
}
.kpi-card{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px 18px;
}
.kpi-label{
  font-size:11.5px;
  color:var(--text-dim);
  margin-bottom:8px;
  text-transform:uppercase;
  letter-spacing:.04em;
}
.kpi-value{
  font-family:var(--font-mono);
  font-size:22px;
  font-weight:600;
  letter-spacing:-0.01em;
}
.kpi-value.positive{ color:var(--pj); }
.kpi-value.negative{ color:var(--danger); }
.kpi-sub{ font-size:11.5px; color:var(--text-faint); margin-top:4px; }

/* Variante compacta — usada na Visão Geral, onde há mais indicadores
   numa única faixa (estilo painel executivo denso) */
.kpi-row-compact{
  grid-template-columns:repeat(auto-fit, minmax(130px, 1fr));
  gap:10px;
  margin-bottom:14px;
}
.kpi-compact{
  padding:11px 13px;
}
.kpi-compact .kpi-label{
  font-size:10px;
  margin-bottom:5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.kpi-compact .kpi-value{
  font-size:16px;
}
.kpi-compact .kpi-sub{
  font-size:10.5px;
  margin-top:2px;
}

/* ===== Panel ===== */
.panel{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
}
.panel-header{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 18px;
  border-bottom:1px solid var(--border);
}
.panel-title{ font-family:var(--font-display); font-weight:600; font-size:14.5px; }
.panel-actions{ display:flex; gap:8px; align-items:center; }

/* ===== Table ===== */
table{ width:100%; border-collapse:collapse; }
thead th{
  text-align:left;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.05em;
  color:var(--text-faint);
  font-weight:600;
  padding:10px 14px;
  border-bottom:1px solid var(--border);
  white-space:nowrap;
}
tbody td{
  padding:11px 14px;
  border-bottom:1px solid var(--border);
  font-size:13.5px;
  vertical-align:middle;
}
tbody tr:last-child td{ border-bottom:none; }
tbody tr:hover{ background:var(--bg-elevated); }
tbody tr.row-selected{ background:var(--danger-soft); }
tbody tr.row-selected:hover{ background:var(--danger-soft); filter:brightness(1.1); }
.amount{ font-family:var(--font-mono); font-weight:500; white-space:nowrap; }
.amount.in{ color:var(--pj); }
.amount.out{ color:var(--danger); }

.cat-pill{
  display:inline-block;
  font-size:11.5px;
  color:var(--text-dim);
  background:var(--bg-elevated);
  border:1px solid var(--border);
  padding:3px 9px;
  border-radius:99px;
}

.status-pill{
  display:inline-flex; align-items:center; gap:5px;
  font-size:11px; font-weight:600;
  padding:3px 9px;
  border-radius:99px;
  text-transform:uppercase;
  letter-spacing:.03em;
}
.status-pill.realizado{ background:var(--pj-soft); color:var(--pj); }
.status-pill.previsto{ background:var(--text-faint)22; color:var(--text-dim); }
.status-pill.aguardando{ background:var(--warn-soft); color:var(--warn); }

/* Selo de travessia PF<->PJ */
.bridge-tag{
  display:inline-flex; align-items:center; gap:5px;
  font-size:10.5px; font-weight:600;
  color:var(--text-dim);
  border:1px dashed var(--text-faint);
  padding:2px 8px;
  border-radius:99px;
}
.bridge-tag svg{ width:10px; height:10px; }

.empty-state{
  padding:48px 24px;
  text-align:center;
  color:var(--text-faint);
}
.empty-state-title{ font-family:var(--font-display); color:var(--text-dim); font-weight:600; margin-bottom:6px; }

/* ===== Calendário (página Calendário) ===== */
.cal-weekdays{
  display:grid;
  grid-template-columns:repeat(7, 1fr);
  border-bottom:1px solid var(--border);
}
.cal-weekday{
  text-align:center;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.05em;
  color:var(--text-faint);
  font-weight:600;
  padding:10px 4px;
}
.cal-grid{
  display:grid;
  grid-template-columns:repeat(7, 1fr);
}
.cal-cell{
  min-height:100px;
  border-right:1px solid var(--border);
  border-bottom:1px solid var(--border);
  padding:6px 8px;
  display:flex;
  flex-direction:column;
  gap:2px;
}
.cal-cell:nth-child(7n){ border-right:none; }
.cal-cell-empty{ background:var(--bg-elevated); opacity:.4; }
.cal-cell-has-items{ cursor:pointer; transition:background .15s ease; }
.cal-cell-has-items:hover{ background:var(--bg-elevated); }
.cal-cell-today{ background:var(--pj-soft); }
.cal-cell-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:2px;
}
.cal-cell-day{
  font-family:var(--font-mono);
  font-size:12px;
  color:var(--text-dim);
  font-weight:500;
}
.cal-cell-today .cal-cell-day{ color:var(--pj); font-weight:700; }
.cal-overdue-dot{
  width:6px; height:6px; border-radius:50%;
  background:var(--danger);
  flex-shrink:0;
}
.cal-amount{
  font-family:var(--font-mono);
  font-size:11px;
  font-weight:600;
  line-height:1.3;
}
.cal-amount-in{ color:var(--pj); }
.cal-amount-out{ color:var(--danger); }
.cal-amount-saldo{
  font-family:var(--font-mono);
  font-size:10px;
  font-weight:500;
  padding-top:2px;
  margin-top:1px;
  border-top:1px dashed var(--border);
  opacity:.85;
}

@media (max-width: 760px){
  .cal-cell{ min-height:60px; padding:4px 5px; }
  .cal-amount{ font-size:9.5px; }
  .cal-weekday{ font-size:9.5px; padding:6px 2px; }
}

/* ===== Kanban (página Clientes) ===== */
.kanban-board{
  display:grid;
  grid-template-columns:repeat(4, minmax(220px, 1fr));
  gap:14px;
  align-items:start;
}
.kanban-column{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  max-height:calc(100vh - 220px);
}
.kanban-column-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 14px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.kanban-column-title{
  font-family:var(--font-display);
  font-weight:600;
  font-size:13px;
}
.kanban-column-body{
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:8px;
  overflow-y:auto;
}
.kanban-card{
  background:var(--bg-elevated);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:10px 12px;
  cursor:pointer;
  transition:filter .15s ease, transform .1s ease;
}
.kanban-card:hover{ filter:brightness(1.1); }
.kanban-card:active{ transform:scale(.98); }
.kanban-card-name{
  font-size:13.5px;
  font-weight:600;
  color:var(--text);
  margin-bottom:3px;
}
.kanban-card-meta{
  font-size:11.5px;
  color:var(--text-faint);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.kanban-empty{
  padding:20px 10px;
  text-align:center;
  font-size:12px;
  color:var(--text-faint);
}

.goal-column-summary{
  display:flex;
  flex-direction:column;
  gap:3px;
  padding-top:6px;

/* ============================================================
   TEMA (claro/escuro) — aplicado antes de tudo o resto pra

function applyTheme(theme){

  const label = document.getElementById('themeLabel');
  if (icon) icon.textContent = theme === 'light' ? '☀' : '☾';
  if (label) label.textContent = theme === 'light' ? 'Tema claro' : 'Tema escuro';

}

function toggleSidebar(){

}

function restoreSidebarState(){
  if (localStorage.getItem('sidebarCollapsed') === '1'){
    const sidebar = document.getElementById('sidebar');
    const btn = document.getElementById('sidebarToggleBtn');
    sidebar.classList.add('collapsed');
    btn.textContent = '☰';
    btn.style.left = '12px';

    document.getElementById('sidebarToggleBtn').style.left = '252px';
  }
}

function toggleTheme(){
  const current = document.documentElement.getAttribute('data-theme') || 'light';

}

/* ============================================================

   ============================================================ */
const SUPABASE_URL = 'https://tipnbhbgmbbodqzwkylb.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_82KM622RPc_1ggErbkvr8w_v7rv8H84';

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ============================================================
   STATE GLOBAL
   ============================================================ */
const state = {
  entityKind: 'pj',          // mantido por compatibilidade com código existente
  activeEntityId: null,       // UUID da empresa ativa (null = dashboard do grupo)
  entities: [],               // todas as empresas do grupo

  budgetItems: [],

  budgetSettings: null,

  loading: false,

  groupSummary: [],           // [{ entity, faturamento, resultadoLiq, saldo, dreData }]
  groupDREData: {},           // { entityId: { groupName: { monthKey: total } } }
  groupFilter: {              // filtro do dashboard consolidado
    year: new Date().getFullYear(),
    month: null,              // null = acumulado do ano, número = mês específico
  },
};

function currentEntity(){
  if (state.activeEntityId) return state.entities.find(e => e.id === state.activeEntityId) || null;
  return state.entities.find(e => e.kind === state.entityKind) || null;
}

/* Transações filtradas pelo período ativo (usa date_competencia) */
function filteredTransactions(){
  if (!state.period) return state.transactions;
  const { year, month } = state.period;
  return state.transactions.filter(t => {
    if (!t.date_competencia) return false;
    const [y, m] = t.date_competencia.split('-').map(Number);
    return y === year && m === month;
  });
}

/* ============================================================
   CÁLCULO DE DRE SIMPLIFICADA (regime de caixa)
   Replica a lógica da planilha original do Lorimar:
   - Receita = Receita de Vendas (realizado)
   - Margem de Contribuição = Receita - Custos Variáveis
   - Resultado Operacional = MC - (Despesas com Pessoal + Despesas Operacionais)
   - Resultado Líquido = Res. Operacional + Entradas não-operacionais - Saídas não-operacionais
   Recebe uma lista de transações já filtrada por período.
   ============================================================ */
const DRE_GROUP_NAMES = {
  receita: 'Receita de Vendas',
  deducoes: 'Deduções da Receita',     // grupo de deduções (Simples, ISS, taxas cartão, etc.)
  custosVariaveis: 'Custos Variáveis',
  despesasPessoal: 'Despesas com Pessoal',
  despesasOperacionais: 'Despesas Operacionais',
  entradasNaoOp: 'Entradas Não Operacionais',
  saidasNaoOp: 'Saídas Não Operacionais',
};

function sumByGroupName(txs, groupName, status = 'realizado'){
  return txs
    .filter(t => t.status === status && t.categories?.groups?.name === groupName)
    .reduce((s,t) => s + Number(t.amount), 0);
}

function computeDRE(txs, status = 'realizado'){
  const receita = sumByGroupName(txs, DRE_GROUP_NAMES.receita, status);
  const custosVariaveis = sumByGroupName(txs, DRE_GROUP_NAMES.custosVariaveis, status);
  const despesasPessoal = sumByGroupName(txs, DRE_GROUP_NAMES.despesasPessoal, status);
  const despesasOperacionais = sumByGroupName(txs, DRE_GROUP_NAMES.despesasOperacionais, status);
  const entradasNaoOp = sumByGroupName(txs, DRE_GROUP_NAMES.entradasNaoOp, status);
  const saidasNaoOp = sumByGroupName(txs, DRE_GROUP_NAMES.saidasNaoOp, status);

  const margemContribuicao = receita - custosVariaveis;
  const despesasOpTotal = despesasPessoal + despesasOperacionais;
  const resultadoOperacional = margemContribuicao - despesasOpTotal;
  const resultadoLiquido = resultadoOperacional + entradasNaoOp - saidasNaoOp;

  const pct = (v) => receita > 0 ? (v / receita) * 100 : 0;

  return {
    receita, custosVariaveis, despesasPessoal, despesasOperacionais, despesasOpTotal,
    entradasNaoOp, saidasNaoOp,
    margemContribuicao, resultadoOperacional, resultadoLiquido,
    pctMC: pct(margemContribuicao),
    pctCustosVariaveis: pct(custosVariaveis),
    pctDespesasOperacionais: pct(despesasOpTotal),
    pctResultadoOperacional: pct(resultadoOperacional),
    pctResultadoLiquido: pct(resultadoLiquido),
  };
}

const MONTH_NAMES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function setPeriod(year, month){
  state.period = (year === null) ? null : { year, month };
  render();
}

function shiftPeriod(delta){
  if (!state.period) {
    const now = new Date();
    state.period = { year: now.getFullYear(), month: now.getMonth() + 1 };
  }
  let { year, month } = state.period;
  month += delta;
  if (month > 12) { month = 1; year++; }
  if (month < 1) { month = 12; year--; }
  state.period = { year, month };
  render();
}

function renderPeriodSelector(){
  const isAll = !state.period;
  const now = new Date();
  const p = state.period || { year: now.getFullYear(), month: now.getMonth() + 1 };
  return `
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:18px;">
      <div style="display:flex; align-items:center; gap:4px; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-sm); padding:4px;">
        <button class="btn btn-ghost btn-sm" onclick="shiftPeriod(-1)" title="Mês anterior" ${isAll ? 'disabled style="opacity:.3;"' : ''}>‹</button>
        <span style="font-family:var(--font-display); font-weight:600; font-size:13px; padding:0 10px; min-width:140px; text-align:center;">
          ${isAll ? 'Todos os períodos' : `${MONTH_NAMES[p.month-1]} / ${p.year}`}
        </span>
        <button class="btn btn-ghost btn-sm" onclick="shiftPeriod(1)" title="Próximo mês" ${isAll ? 'disabled style="opacity:.3;"' : ''}>›</button>
      </div>
      <button class="btn btn-sm ${isAll ? 'btn-primary ' + state.entityKind : 'btn-ghost'}" onclick="setPeriod(null, null)">Todos os períodos</button>
      ${isAll ? `<button class="btn btn-ghost btn-sm" onclick="setPeriod(${now.getFullYear()}, ${now.getMonth()+1})">Voltar pro mês atual</button>` : ''}
    </div>
  `;
}

   BOOT — chamado direto ao carregar a página

async function boot(){
  const syncStatus = document.getElementById('syncStatus');
  syncStatus.textContent = 'Carregando dados…';

  const now = new Date();
  state.period = { year: now.getFullYear(), month: now.getMonth() + 1 };

  try {
    await loadEntities();
    // Inicia na GN Consultoria por padrão ao entrar em uma empresa
    const gn = state.entities.find(e => e.name === 'GN Consultoria') || state.entities[0];
    if (gn) state.activeEntityId = gn.id;

    await Promise.all([loadEntityData(), loadCrmContacts(), loadBudget(), loadGroupSummary(), loadCreditCards(), loadTaxEntries()]);
    syncStatus.textContent = 'Sincronizado';
    // Abre no dashboard do grupo
    state.page = 'grupo';
    render();
    restoreNavGroupStates();
    restoreSidebarState();
  } catch (err) {
    console.error(err);
    syncStatus.textContent = 'Erro de sincronização';
    toast('Erro ao carregar dados: ' + err.message, 'error');
  }
}

async function loadEntities(){
  const { data, error } = await supabaseClient.from('entities')
    .select('*')
    .eq('is_active', true)
    .neq('kind', 'pf') // exclui PF — apenas empresas do grupo
    .order('name');
  if (error) throw error;
  state.entities = data;
}

/* Carrega indicadores resumidos de TODAS as empresas para o dashboard do grupo */
async function loadGroupSummary(){
  const pjEntities = state.entities.filter(e => e.kind === 'pj');
  const { year, month } = state.groupFilter;

  const startDate = month
    ? `${year}-${String(month).padStart(2,'0')}-01`
    : `${year}-01-01`;
  const endDate = month
    ? `${year}-${String(month).padStart(2,'0')}-31`
    : `${year}-12-31`;

  const summaries = await Promise.all(pjEntities.map(async entity => {
    const [
      { data: txsYear },
      { data: txsAll },
      { data: sales },
      { data: accounts }
    ] = await Promise.all([
      supabaseClient.from('transactions')
        .select('amount, flow_type, status, date_competencia, categories(name, groups(name))')
        .eq('entity_id', entity.id)
        .eq('status', 'realizado')
        .gte('date_competencia', startDate)
        .lte('date_competencia', endDate),
      supabaseClient.from('transactions')
        .select('amount, flow_type, status')
        .eq('entity_id', entity.id)
        .eq('status', 'realizado'),
      supabaseClient.from('sales')
        .select('total_amount, status')
        .eq('entity_id', entity.id)
        .eq('status', 'fechada')
        .gte('date_competencia', startDate)
        .lte('date_competencia', endDate),
      supabaseClient.from('accounts')
        .select('initial_balance')
        .eq('entity_id', entity.id)
        .eq('is_active', true)
    ]);

    const txList = txsYear || [];
    const salesList = sales || [];
    const allTxs = txsAll || [];

    const faturamento = salesList.reduce((s,v) => s + Number(v.total_amount), 0);
    const dre = computeDRE(txList);

    const saldoInicial = (accounts || []).reduce((s,a) => s + Number(a.initial_balance), 0);
    const entradas = allTxs.filter(t => t.flow_type === 'entrada').reduce((s,t) => s + Number(t.amount), 0);
    const saidas   = allTxs.filter(t => t.flow_type === 'saida').reduce((s,t)   => s + Number(t.amount), 0);
    const saldo = saldoInicial + entradas - saidas;

    // índice de DRE por grupo para a DRE consolidada
    const dreByGroup = {};
    txList.forEach(t => {
      const g = t.categories?.groups?.name;
      if (!g) return;
      dreByGroup[g] = (dreByGroup[g] || 0) + Number(t.amount);
    });

    return { entity, faturamento, resultadoLiq: dre.resultadoLiquido, saldo, dreByGroup, dre };
  }));

  state.groupSummary = summaries;
}

/* Carrega grupos/categorias/contas/transações da entidade ATIVA */
async function loadEntityData(){
  const entity = currentEntity();
  if (!entity) return;

  const [
    { data: groups, error: ge },
    { data: accounts, error: ae },
    { data: txs, error: te },
    { data: clients, error: ce },
    { data: sales, error: se },
    { data: projectionItems, error: pe },
    { data: fixedCosts, error: fe },
    { data: assumptions, error: cae },
    { data: goals, error: goe }
  ] = await Promise.all([
    supabaseClient.from('groups').select('*, categories(*)').eq('entity_id', entity.id).order('name'),
    supabaseClient.from('accounts').select('*').eq('entity_id', entity.id).eq('is_active', true).order('name'),
    supabaseClient.from('transactions').select('*, categories(name, groups(name))').eq('entity_id', entity.id).order('date_competencia', { ascending: false }).limit(2000),
    supabaseClient.from('clients').select('*').eq('entity_id', entity.id).order('name'),
    supabaseClient.from('sales').select('*, clients(name), categories(name), sale_installments(*)').eq('entity_id', entity.id).order('date_competencia', { ascending: false }),
    supabaseClient.from('projection_items').select('*, categories(name, groups(name))').eq('entity_id', entity.id).order('due_date', { ascending: true }),
    supabaseClient.from('fixed_costs').select('*, categories(name)').eq('entity_id', entity.id).eq('is_active', true).order('name'),
    supabaseClient.from('competence_assumptions').select('*').eq('entity_id', entity.id).maybeSingle(),
    supabaseClient.from('goals').select('*').eq('entity_id', entity.id).eq('is_active', true).order('due_date', { ascending: true })
  ]);

  if (ge) throw ge;
  if (ae) throw ae;
  if (te) throw te;
  if (ce) throw ce;
  if (se) throw se;
  if (pe) throw pe;
  if (fe) throw fe;
  if (cae) throw cae;
  if (goe) throw goe;

  state.groups = groups || [];
  state.categories = (groups || []).flatMap(g => g.categories || []);
  state.accounts = accounts || [];
  state.transactions = txs || [];
  state.clients = clients || [];
  state.sales = sales || [];
  state.projectionItems = projectionItems || [];
  state.fixedCosts = fixedCosts || [];
  state.goals = goals || [];
  state.competenceAssumptions = assumptions || { tax_pct: 6, variable_pct: 10 };
}

async function loadCrmContacts(){
  const { data, error } = await supabaseClient.from('crm_contacts').select('*').order('created_at', { ascending: false });
  if (error) throw error;
  state.crmContacts = data || [];
}

async function loadCreditCards(){
  const entity = currentEntity();
  if (!entity) return;
  const { data: cards, error: ce } = await supabaseClient.from('credit_cards').select('*').eq('entity_id', entity.id).eq('is_active', true).order('name');
  if (ce) throw ce;
  state.creditCards = cards || [];

  if (state.creditCards.length === 0) { state.creditCardTxs = []; state.creditCardInstallments = []; return; }

  const cardIds = state.creditCards.map(c => c.id);
  const { data: txs, error: te } = await supabaseClient.from('credit_card_transactions').select('*').in('card_id', cardIds).order('first_due_date', { ascending: false });
  if (te) throw te;
  state.creditCardTxs = txs || [];

  const txIds = (txs || []).map(t => t.id);
  if (txIds.length === 0) { state.creditCardInstallments = []; return; }
  const { data: insts, error: ie } = await supabaseClient.from('credit_card_installments').select('*').in('transaction_id', txIds).order('due_date');
  if (ie) throw ie;
  state.creditCardInstallments = insts || [];
}

async function loadTaxEntries(){
  const entity = currentEntity();
  if (!entity) return;
  const { data, error } = await supabaseClient
    .from('tax_entries')
    .select('*')
    .eq('entity_id', entity.id)
    .order('period_date', { ascending: false });
  if (error) throw error;
  state.taxEntries = data || [];
}

async function loadBudget(){
  const entity = state.entities?.find(e => e.kind === 'pj') || state.entities?.[0];
  if (!entity) return;

  const [
    { data: items, error: ie },
    { data: values, error: ve },
    { data: settings, error: se }
  ] = await Promise.all([
    supabaseClient.from('budget_items').select('*').eq('entity_id', entity.id).eq('is_active', true).order('group_type').order('sort_order'),
    supabaseClient.from('budget_values').select('*, budget_items!inner(entity_id)').eq('budget_items.entity_id', entity.id),
    supabaseClient.from('budget_settings').select('*').eq('entity_id', entity.id).maybeSingle()
  ]);

  if (ie) throw ie;
  if (ve) throw ve;
  if (se) throw se;

  state.budgetItems = items || [];
  // indexa valores por itemId -> { 'YYYY-MM': amount }
  const valMap = {};
  (values || []).forEach(v => {
    if (!valMap[v.budget_item_id]) valMap[v.budget_item_id] = {};
    valMap[v.budget_item_id][v.year_month] = Number(v.amount);
  });
  state.budgetValues = valMap;
  state.budgetSettings = settings || { initial_cash_balance: 0, deduction_pct: 6.00 };
}

function toggleNavGroup(labelEl){
  const group = labelEl.closest('.nav-group');
  group.classList.toggle('collapsed');
  // persiste estado no localStorage
  const label = labelEl.childNodes[0].textContent.trim();
  const collapsed = JSON.parse(localStorage.getItem('navCollapsed') || '{}');
  collapsed[label] = group.classList.contains('collapsed');
  localStorage.setItem('navCollapsed', JSON.stringify(collapsed));

function restoreNavGroupStates(){
  const collapsed = JSON.parse(localStorage.getItem('navCollapsed') || '{}');
  document.querySelectorAll('.nav-group').forEach(group => {
    const label = group.querySelector('.nav-label')?.childNodes[0]?.textContent?.trim();

  });

function formatDate(d){
  if (!d) return '—';
  const [y,m,day] = d.split('-');
  return `${day}/${m}/${y}`;

  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============================================================
   PÁGINA: VISÃO COMPETÊNCIA (tela de abertura — indicadores + gráficos)
   ============================================================ */

/* Vendas fechadas filtradas por período (mesma lógica de filteredSales) */
function dreCardClass(value){
  return value >= 0 ? 'positive' : 'negative';
}

/* ============================================================
   PÁGINA: VISÃO COMPETÊNCIA (tela de abertura — regime de venda)
   EBIT competência = Faturamento - Custo Variável Estimado - Custos Fixos
   Custo Variável Estimado = Faturamento x (% Imposto + % Variável)
   PE Competência = Custos Fixos ÷ % MC (calculada com as premissas)
   ============================================================ */
/* Retorna quantos meses o período filtrado abrange.
   - Se filtro = mês específico → 1
   - Se filtro = "Todos os períodos" → conta meses distintos com vendas fechadas */
function countPeriodMonths(){
  if (state.period) return 1; // mês específico = sempre 1

  // "Todos os períodos" = conta meses distintos com vendas fechadas
  const months = new Set(
    state.sales
      .filter(s => s.status === 'fechada' && s.date_competencia)
      .map(s => s.date_competencia.slice(0, 7))
  );
  return Math.max(1, months.size);
}

function computeCompetenceDRE(faturamentoTotal){
  const assumptions = state.competenceAssumptions || { tax_pct: 6, variable_pct: 10 };
  const taxPct = Number(assumptions.tax_pct);
  const varPct = Number(assumptions.variable_pct);
  const totalCustoVarPct = taxPct + varPct;

  const custoVariavelEstimado = faturamentoTotal * (totalCustoVarPct / 100);
  const margemContribuicao = faturamentoTotal - custoVariavelEstimado;
  const pctMC = faturamentoTotal > 0 ? (margemContribuicao / faturamentoTotal) * 100 : 0;

  // multiplica pelo número de meses do período para ficar proporcional ao faturamento
  const nMonths = countPeriodMonths();
  const custosFixosMensal = state.fixedCosts.reduce((s,c) => s + Number(c.monthly_amount), 0);
  const custosFixos = custosFixosMensal * nMonths;

  const ebit = margemContribuicao - custosFixos;
  const pctEbit = faturamentoTotal > 0 ? (ebit / faturamentoTotal) * 100 : 0;

  // PE usa o custo mensal (não o acumulado) — o PE é sempre por mês
  const pontoEquilibrio = pctMC > 0 ? custosFixosMensal / (pctMC / 100) : 0;

  return {
    taxPct, varPct, totalCustoVarPct, custoVariavelEstimado,
    margemContribuicao, pctMC,
    custosFixosMensal, custosFixos, nMonths,
    ebit, pctEbit, pontoEquilibrio
  };
}

function renderGrupoDashboard(){

  const totalSaldo = summary.reduce((s,x) => s + x.saldo, 0);

  const COMPANY_COLORS = ['#2952A3','#3DB87F','#8B5FA6','#C97A4A'];

    ? `${MONTH_NAMES[month-1]}/${year}`
    : `Jan–Dez/${year}`;

    <!-- DRE CONSOLIDADA -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">DRE Consolidada — Grupo PGN</div>
        <span style="font-size:12px; color:var(--text-faint);">${periodoLabel} · Regime Caixa</span>
      </div>
      <table>

          <tr style="background:var(--bg-elevated);">

            <th style="text-align:right; padding:8px 16px; font-size:11px; color:var(--text-faint);">% Receita</th>
            ${summary.map(x => `<th style="text-align:right; padding:8px 10px; font-size:11px; color:var(--text-faint);">${escapeHtml(x.entity.name.split(' ')[0])}</th>`).join('')}

        <tbody>

                <td style="text-align:right; padding:6px 16px; font-size:11.5px; color:${isKpi?color:'var(--text-faint)'};">
                  ${isKpi || row.tipo==='receita' ? pctVal : ''}
                </td>
                ${summary.map(x => {
                  // valor da linha por empresa
                  const gb = x.dreByGroup || {};
                  let ev = 0;
                  if (row.label.includes('Receita Bruta')) ev = gb[gn.receita] || 0;
                  else if (row.label.includes('Deduções')) ev = -(gb[gn.deducoes] || 0);
                  else if (row.label.includes('Receita Líquida')) ev = (gb[gn.receita]||0) - (gb[gn.deducoes]||0);
                  else if (row.label.includes('Custos Variáveis')) ev = -(gb[gn.custosVariaveis]||0);
                  else if (row.label.includes('Margem de Contribuição')) ev = (gb[gn.receita]||0)-(gb[gn.deducoes]||0)-(gb[gn.custosVariaveis]||0);
                  else if (row.label.includes('Pessoal')) ev = -(gb[gn.despesasPessoal]||0);
                  else if (row.label.includes('Operacionais') && row.label.includes('(-)')) ev = -(gb[gn.despesasOperacionais]||0);
                  else if (row.label.includes('EBIT')) ev = (gb[gn.receita]||0)-(gb[gn.deducoes]||0)-(gb[gn.custosVariaveis]||0)-(gb[gn.despesasPessoal]||0)-(gb[gn.despesasOperacionais]||0);
                  else if (row.label.includes('Entradas Não')) ev = gb[gn.entradasNaoOp]||0;
                  else if (row.label.includes('Saídas Não')) ev = -(gb[gn.saidasNaoOp]||0);
                  else if (row.label.includes('Resultado Líquido')) ev = x.resultadoLiq;
                  const ec = ev >= 0 ? 'var(--pj)' : 'var(--danger)';
                  return `<td style="text-align:right; padding:6px 10px; font-size:11.5px; color:${isKpi?ec:'var(--text-faint)'}; font-weight:${isKpi?'600':'400'};">${ev !== 0 ? formatMoney(ev) : '—'}</td>`;
                }).join('')}
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

/* ============================================================
   PÁGINA: DRE — Demonstração do Resultado (Regime Caixa)
   Mês a mês em colunas, grupos expansíveis por categoria.
   Exclui transferências dos cálculos.
   ============================================================ */

const DRE_YEAR = new Date().getFullYear();

// Meses com dados (realizados) — mostra o ano corrente completo
function getDREMonths(){
  const months = [];
  for (let m = 1; m <= 12; m++){
    months.push({
      key: `${DRE_YEAR}-${String(m).padStart(2,'0')}`,
      label: `${MONTH_NAMES[m-1].slice(0,3)}/${String(DRE_YEAR).slice(2)}`
    });
  }
  return months;
}

function isDRETransfer(t){
  return !!t.mirror_transaction_id ||
    t.categories?.name === 'Transferência Enviada' ||
    t.categories?.name === 'Transferência Recebida';
}

function renderDRE(){
  const txs = state.transactions.filter(t => t.status === 'realizado' && !isDRETransfer(t));
  const dreMonths = getDREMonths();
  const expandedGroups = window._dreExpanded || {};

  // Indexa transações por mês e grupo
  const dreData = {}; // { groupName: { monthKey: { total, cats: { catName: total } } } }

  txs.forEach(t => {
    const groupName = t.categories?.groups?.name;
    const catName   = t.categories?.name;
    const monthKey  = t.date_competencia?.slice(0,7);
    if (!groupName || !monthKey) return;

    if (!dreData[groupName]) dreData[groupName] = {};
    if (!dreData[groupName][monthKey]) dreData[groupName][monthKey] = { total: 0, cats: {} };
    dreData[groupName][monthKey].total += Number(t.amount);
    if (!dreData[groupName][monthKey].cats[catName]) dreData[groupName][monthKey].cats[catName] = 0;
    dreData[groupName][monthKey].cats[catName] += Number(t.amount);
  });

  // Calcula totais por linha de DRE por mês
  function groupTotal(groupName, monthKey){
    return dreData[groupName]?.[monthKey]?.total || 0;
  }
  function sumGroups(names, monthKey){
    return names.reduce((s,n) => s + groupTotal(n, monthKey), 0);
  }

  const receita     = DRE_GROUP_NAMES.receita;
  const deducoes    = DRE_GROUP_NAMES.deducoes;
  const cv          = DRE_GROUP_NAMES.custosVariaveis;
  const pessoal     = DRE_GROUP_NAMES.despesasPessoal;
  const op          = DRE_GROUP_NAMES.despesasOperacionais;
  const entNaoOp    = DRE_GROUP_NAMES.entradasNaoOp;
  const saiNaoOp    = DRE_GROUP_NAMES.saidasNaoOp;

  // Total anual de cada linha
  const total = (fn) => dreMonths.reduce((s,m) => s + fn(m.key), 0);

  const col  = 'text-align:right; font-family:var(--font-mono); font-size:12px; padding:6px 10px; min-width:88px;';
  const lbl  = 'padding:6px 14px; font-size:12.5px;';
  const kpi  = (v) => `${col} font-weight:700; color:${v >= 0 ? 'var(--pj)' : 'var(--danger)'};`;
  const neg  = `${col} color:var(--danger);`;
  const pos  = `${col} color:var(--pj);`;
  const faint = `${col} color:var(--text-faint); font-size:11.5px;`;

  const fmtCol = (v, isExpense=false) => v !== 0
    ? `<td style="${isExpense ? neg : pos}">${formatMoney(v)}</td>`
    : `<td style="${faint}">—</td>`;

  const renderGroupRow = (groupName, isExpense=false) => {
    const isExpanded = expandedGroups[groupName];
    const cats = new Set();
    dreMonths.forEach(m => {
      Object.keys(dreData[groupName]?.[m.key]?.cats || {}).forEach(c => cats.add(c));
    });

    return `
      <tr style="cursor:pointer;" onclick="toggleDREGroup('${groupName.replace(/'/g,"\\'")}')">
        <td style="${lbl}">
          <span style="margin-right:6px; font-size:10px; color:var(--text-faint);">${isExpanded ? '▾' : '▸'}</span>
          ${escapeHtml(groupName)}
        </td>
        ${dreMonths.map(m => fmtCol(groupTotal(groupName, m.key), isExpense)).join('')}
        ${fmtCol(total(mk => groupTotal(groupName, mk)), isExpense)}
      </tr>
      ${isExpanded ? [...cats].sort().map(cat => `
        <tr style="background:var(--bg-elevated);">
          <td style="${lbl} padding-left:32px; color:var(--text-dim); font-size:12px;">↳ ${escapeHtml(cat)}</td>
          ${dreMonths.map(m => {
            const v = dreData[groupName]?.[m.key]?.cats[cat] || 0;
            return v !== 0 ? `<td style="${faint} color:${isExpense ? 'var(--danger)' : 'var(--pj)'}; opacity:.85;">${formatMoney(v)}</td>`
                           : `<td style="${faint}">—</td>`;
          }).join('')}
          <td style="${faint} color:${isExpense ? 'var(--danger)' : 'var(--pj)'}; opacity:.85;">${formatMoney(total(mk => dreData[groupName]?.[mk]?.cats[cat] || 0))}</td>
        </tr>
      `).join('') : ''}
    `;
  };

  const renderKpiRow = (label, fn, highlight=false, showPct=false) => `
    <tr style="background:${highlight ? 'var(--bg-card)' : 'var(--bg-elevated)'}; border-top:${highlight ? '2' : '1'}px solid var(--border);">
      <td style="${lbl} font-weight:700;">${label}</td>
      ${dreMonths.map(m => {
        const v = fn(m.key);
        const rec = groupTotal(receita, m.key);
        const pct = showPct && rec > 0 ? ` <span style="font-size:10px; opacity:.7;">(${((v/rec)*100).toFixed(1)}%)</span>` : '';
        return `<td style="${kpi(v)}">${formatMoney(v)}${pct}</td>`;
      }).join('')}
      <td style="${kpi(total(fn))} border-left:2px solid var(--border);">
        ${formatMoney(total(fn))}
        ${showPct && total(mk => groupTotal(receita,mk)) > 0
          ? `<br><span style="font-size:10px; opacity:.7;">${((total(fn)/total(mk=>groupTotal(receita,mk)))*100).toFixed(1)}%</span>`
          : ''}
      </td>
    </tr>
  `;

  return `
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap;">
      <div class="bridge-note" style="flex:1; margin:0;">
        <span>ℹ</span>
        <span>DRE em Regime de Caixa — apenas lançamentos <strong>realizados</strong> de ${DRE_YEAR}. Clique em qualquer grupo para expandir o detalhe por categoria.</span>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="printDRE()" style="border:1px solid var(--border); flex-shrink:0;">
        🖨 Imprimir / Download PDF
      </button>
    </div>

    <div id="dre-printable" style="overflow-x:auto;">
      <table style="border-collapse:collapse; width:100%; min-width:${160 + dreMonths.length*90}px;">
        <thead>
          <tr style="background:var(--bg-elevated); border-bottom:2px solid var(--border);">
            <th style="${lbl} text-align:left; min-width:180px;">Descrição</th>
            ${dreMonths.map(m => `<th style="${col}">${m.label}</th>`).join('')}
            <th style="${col} font-weight:700; border-left:2px solid var(--border);">Total</th>
          </tr>
        </thead>
        <tbody>

          <!-- RECEITA BRUTA -->
          <tr style="background:var(--bg-elevated);">
            <td colspan="${dreMonths.length+2}" style="padding:5px 14px; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); font-weight:600;">Receita</td>
          </tr>
          ${renderGroupRow(receita)}

          <!-- DEDUÇÕES DA RECEITA -->
          <tr style="background:var(--bg-elevated);">
            <td colspan="${dreMonths.length+2}" style="padding:5px 14px; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); font-weight:600;">Deduções da Receita</td>
          </tr>
          ${renderGroupRow(deducoes, true)}

          <!-- RECEITA LÍQUIDA -->
          ${renderKpiRow('Receita Líquida', mk => groupTotal(receita,mk) - groupTotal(deducoes,mk), true)}

          <!-- CUSTOS VARIÁVEIS -->
          <tr style="background:var(--bg-elevated);">
            <td colspan="${dreMonths.length+2}" style="padding:5px 14px; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); font-weight:600;">Custos Variáveis</td>
          </tr>
          ${renderGroupRow(cv, true)}

          <!-- MARGEM DE CONTRIBUIÇÃO -->
          ${renderKpiRow('Margem de Contribuição', mk => groupTotal(receita,mk) - groupTotal(deducoes,mk) - groupTotal(cv,mk), true)}

          <!-- DESPESAS OPERACIONAIS -->
          <tr style="background:var(--bg-elevated);">
            <td colspan="${dreMonths.length+2}" style="padding:5px 14px; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); font-weight:600;">Despesas Operacionais</td>
          </tr>
          ${renderGroupRow(pessoal, true)}
          ${renderGroupRow(op, true)}

          <!-- EBIT / RESULTADO OPERACIONAL -->
          ${renderKpiRow('Resultado Operacional (EBIT)', mk =>
            groupTotal(receita,mk) - groupTotal(deducoes,mk) - groupTotal(cv,mk) - groupTotal(pessoal,mk) - groupTotal(op,mk), true, true)}

          <!-- NÃO OPERACIONAL -->
          <tr style="background:var(--bg-elevated);">
            <td colspan="${dreMonths.length+2}" style="padding:5px 14px; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); font-weight:600;">Não Operacional</td>
          </tr>
          ${renderGroupRow(entNaoOp)}
          ${renderGroupRow(saiNaoOp, true)}

          <!-- RESULTADO LÍQUIDO -->
          ${renderKpiRow('Resultado Líquido', mk =>
            groupTotal(receita,mk) - groupTotal(deducoes,mk) - groupTotal(cv,mk) - groupTotal(pessoal,mk) - groupTotal(op,mk)
            + groupTotal(entNaoOp,mk) - groupTotal(saiNaoOp,mk), true, true)}

        </tbody>
      </table>
    </div>
  `;
}

function toggleDREGroup(groupName){
  if (!window._dreExpanded) window._dreExpanded = {};
  window._dreExpanded[groupName] = !window._dreExpanded[groupName];
  render();
}

async function saveCompetenceAssumptions(){
  const entity = currentEntity();
  const taxPct = parseFloat(document.getElementById('compTaxPct').value);
  const varPct = parseFloat(document.getElementById('compVarPct').value);

  if (isNaN(taxPct) || isNaN(varPct) || taxPct < 0 || varPct < 0) {
    toast('Informe percentuais válidos.', 'error');
    return;
  }

  try {
    const { error } = await supabaseClient.from('competence_assumptions').upsert({
      entity_id: entity.id,
      tax_pct: taxPct,
      variable_pct: varPct,
      updated_at: new Date().toISOString()
    }, { onConflict: 'entity_id' });
    if (error) throw error;
    toast('Premissas atualizadas.');
    await loadEntityData();
    render();
  } catch (err) {
    toast('Erro ao salvar premissas: ' + err.message, 'error');
  }
}

/* Gráfico de barras horizontais — produto x valor.
   mode='receita' usa transactions (categorias de Receita de Vendas, realizado).
   mode='faturamento' usa vendas fechadas (sales). */
/* Paleta categórica para os donuts — harmoniza com o resto do sistema
   mas precisa de mais variação que só PF/PJ pra distinguir fatias */
const CHART_PALETTE = ['#3D8B6E', '#C97A4A', '#D4A23C', '#5B7FB5', '#8B5FA6', '#C9594A', '#4FA8A8', '#A8954F'];

function renderProductBarChart(data, mode){
  let rows;
  if (mode === 'receita') {
    const byProduct = {};
    data.filter(t => t.status === 'realizado' && t.categories?.groups?.name === DRE_GROUP_NAMES.receita)
      .forEach(t => {
        const name = t.categories?.name || 'Sem categoria';
        byProduct[name] = (byProduct[name] || 0) + Number(t.amount);
      });
    rows = Object.entries(byProduct);
  } else {
    const byProduct = {};
    data.forEach(s => {
      const name = s.categories?.name || 'Sem categoria';
      byProduct[name] = (byProduct[name] || 0) + Number(s.total_amount);
    });
    rows = Object.entries(byProduct);
  }

  rows = rows.filter(([,v]) => v > 0).sort((a,b) => b[1]-a[1]);

  if (rows.length === 0) {
    return `<div style="text-align:center; padding:24px; color:var(--text-faint); font-size:13px;">Sem dados no período</div>`;
  }

  const total = rows.reduce((s,[,v]) => s+v, 0);

  // Monta o donut como uma série de arcos SVG via stroke-dasharray no círculo
  const R = 60, CX = 70, CY = 70, STROKE = 26;
  const circumference = 2 * Math.PI * R;
  let cumulativePct = 0;

  const arcs = rows.map(([name, value], idx) => {
    const pct = value / total;
    const dash = pct * circumference;
    const gap = circumference - dash;
    const offset = -cumulativePct * circumference;
    cumulativePct += pct;
    const color = CHART_PALETTE[idx % CHART_PALETTE.length];
    return `<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${color}"
              stroke-width="${STROKE}" stroke-dasharray="${dash} ${gap}" stroke-dashoffset="${offset}"
              transform="rotate(-90 ${CX} ${CY})">
              <title>${escapeHtml(name)}: ${formatMoney(value)} (${(pct*100).toFixed(1)}%)</title>
            </circle>`;
  }).join('');

  const legend = rows.map(([name, value], idx) => {
    const pct = total > 0 ? (value / total) * 100 : 0;
    const color = CHART_PALETTE[idx % CHART_PALETTE.length];
    return `
      <div style="display:flex; align-items:center; gap:8px; font-size:12px; padding:3px 0;">
        <span style="width:9px; height:9px; border-radius:2px; background:${color}; flex-shrink:0;"></span>
        <span style="color:var(--text-dim); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(name)}</span>
        <span style="color:var(--text-faint); font-size:11px;">${pct.toFixed(0)}%</span>
        <span class="amount" style="color:var(--text); min-width:80px; text-align:right;">${formatMoney(value)}</span>
      </div>
    `;
  }).join('');

  return `
    <div style="display:flex; align-items:center; gap:24px; flex-wrap:wrap;">
      <svg viewBox="0 0 140 140" style="width:140px; height:140px; flex-shrink:0;">
        ${arcs}
        <text x="70" y="66" text-anchor="middle" font-size="10" fill="var(--text-faint)" font-family="var(--font-body)">Total</text>
        <text x="70" y="80" text-anchor="middle" font-size="11" fill="var(--text)" font-family="var(--font-mono)" font-weight="600">${formatMoney(total).replace('R$','').trim()}</text>
      </svg>
      <div style="flex:1; min-width:180px;">${legend}</div>
    </div>
  `;
}

/* Gráfico de barras verticais — evolução mensal (jan-dez) do ano em foco.
   Usa o ano do período ativo, ou o ano atual se "todos os períodos". */
function renderMonthlyBarChart(mode){
  const year = state.period ? state.period.year : new Date().getFullYear();

  const monthlyValues = MONTH_NAMES.map((_, idx) => {
    const month = idx + 1;
    if (mode === 'faturamento') {
      return state.sales
        .filter(s => s.status === 'fechada' && s.date_competencia)
        .filter(s => {
          const [y, m] = s.date_competencia.split('-').map(Number);
          return y === year && m === month;
        })
        .reduce((sum, s) => sum + Number(s.total_amount), 0);
    } else {
      return state.transactions
        .filter(t => t.status === 'realizado' && t.categories?.groups?.name === DRE_GROUP_NAMES.receita && t.date_competencia)
        .filter(t => {
          const [y, m] = t.date_competencia.split('-').map(Number);
          return y === year && m === month;
        })
        .reduce((sum, t) => sum + Number(t.amount), 0);
    }
  });

  const max = Math.max(...monthlyValues, 1);
  const barColor = mode === 'faturamento' ? 'var(--pf)' : 'var(--pj)';
  const W = 560, H = 190, padBottom = 26, padTop = 22, barGap = 5;
  const barWidth = (W / 12) - barGap;

  /* Valor compacto em cima da barra: 7.5k em vez de R$ 7.500,00 — evita
     poluir o gráfico, igual o padrão da planilha de referência */
  const compact = (v) => {
    if (v === 0) return '';
    if (v >= 1000) return (v/1000).toLocaleString('pt-BR', {maximumFractionDigits:1}) + 'k';
    return v.toLocaleString('pt-BR', {maximumFractionDigits:0});
  };

  const bars = monthlyValues.map((v, i) => {
    const barH = max > 0 ? (v / max) * (H - padBottom - padTop) : 0;
    const x = i * (W / 12) + barGap / 2;
    const y = H - padBottom - barH;
    const isCurrentMonthHighlight = state.period && state.period.month === i + 1;
    return `
      <g>
        ${v > 0 ? `<text x="${x + barWidth/2}" y="${y - 5}" text-anchor="middle" font-size="9" fill="var(--text-dim)" font-family="var(--font-mono)">${compact(v)}</text>` : ''}
        <rect x="${x}" y="${y}" width="${barWidth}" height="${Math.max(barH,1)}" rx="3"
              fill="${barColor}" opacity="${isCurrentMonthHighlight ? '1' : '0.65'}">
          <title>${MONTH_NAMES[i]}: ${formatMoney(v)}</title>
        </rect>
        <text x="${x + barWidth/2}" y="${H - 9}" text-anchor="middle" font-size="9.5" fill="var(--text-faint)" font-family="var(--font-body)">
          ${MONTH_NAMES[i].slice(0,3)}
        </text>
      </g>
    `;
  }).join('');

  const total = monthlyValues.reduce((s,v) => s+v, 0);

  return `
    <div style="font-size:11.5px; color:var(--text-faint); margin-bottom:6px;">Ano de ${year} · Total: <span style="color:var(--text); font-family:var(--font-mono);">${formatMoney(total)}</span></div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; display:block;">
      ${bars}
    </svg>
  `;
}

/* ============================================================
   PÁGINA: PROJEÇÃO AUTOMÁTICA (DRE Previsto x Realizado)
   Espelha os dados reais já existentes no fluxo de caixa
   (transactions), sem precisar cadastrar nada novo — diferente
   da Simulação de Cenários, que é um espaço livre/hipotético.
   ============================================================ */
/* ============================================================
   PÁGINA: PROVISÃO ORÇAMENTÁRIA
   DRE manual, Jun/26–Jun/27 (13 meses). Totalmente isolado.
   Estrutura: Receita → Deduções → CV → [Margem Bruta]
              → Custos Op → [Resultado Op]
              → Ent.NãoOp → Saí.NãoOp → [Resultado Líquido]
              → [Geração de Caixa (acumulado)]
   ============================================================ */

const BUDGET_MONTHS = (()=>{
  const months = [];
  for (let i = 0; i < 13; i++){
    const d = new Date(2026, 5 + i, 1); // Jun/26 = index 5
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const label = `${MONTH_NAMES[d.getMonth()].slice(0,3)}/${String(d.getFullYear()).slice(2)}`;
    months.push({ key, label });
  }
  return months;
})();

const BUDGET_GROUPS = [
  { key: 'receita',              label: 'Receita',                  flow: 1  },
  { key: 'deducoes',             label: 'Deduções da Receita',      flow: -1 },
  { key: 'custos_variaveis',     label: 'Custos Variáveis',         flow: -1 },
  { key: 'custos_operacionais',  label: 'Custos Operacionais',      flow: -1 },
  { key: 'entradas_nao_op',      label: 'Entradas Não Operacionais',flow: 1  },
  { key: 'saidas_nao_op',        label: 'Saídas Não Operacionais',  flow: -1 },
];

const BUDGET_GROUP_LABELS = Object.fromEntries(BUDGET_GROUPS.map(g => [g.key, g.label]));

function getBudgetVal(itemId, monthKey){
  return state.budgetValues[itemId]?.[monthKey] || 0;
}

function computeBudgetKPIs(){
  // Retorna { monthKey: { receitaTotal, deducaoAuto, margemBruta, resultadoOp, resultadoLiq, geracaoCaixa } }
  const kpis = {};
  const initialBalance = state.budgetSettings?.initial_cash_balance || 0;
  const deductionPct = Number(state.budgetSettings?.deduction_pct ?? 6) / 100;
  let accumulated = initialBalance;

  // Calcula receita total por mês primeiro (precisamos do mês anterior)
  const receitaByMonth = {};
  BUDGET_MONTHS.forEach(({ key }) => {
    receitaByMonth[key] = state.budgetItems
      .filter(i => i.group_type === 'receita')
      .reduce((s, i) => s + getBudgetVal(i.id, key), 0);
  });

  BUDGET_MONTHS.forEach(({ key }, idx) => {
    const itemsByGroup = {};
    BUDGET_GROUPS.forEach(g => { itemsByGroup[g.key] = 0; });
    state.budgetItems.forEach(item => {
      itemsByGroup[item.group_type] = (itemsByGroup[item.group_type] || 0) + getBudgetVal(item.id, key);
    });

    // Dedução automática = receita do mês anterior × %
    // Junho/26 (primeiro mês) = zero (sem mês anterior no período)
    const prevKey = idx > 0 ? BUDGET_MONTHS[idx - 1].key : null;
    const deducaoAuto = prevKey ? receitaByMonth[prevKey] * deductionPct : 0;

    const receitaTotal = itemsByGroup.receita;
    const margemBruta = receitaTotal - deducaoAuto - itemsByGroup.custos_variaveis;
    const resultadoOp = margemBruta - itemsByGroup.custos_operacionais;
    const resultadoLiq = resultadoOp + itemsByGroup.entradas_nao_op - itemsByGroup.saidas_nao_op;
    accumulated += resultadoLiq;
    kpis[key] = { receitaTotal, deducaoAuto, margemBruta, resultadoOp, resultadoLiq, geracaoCaixa: accumulated };
  });

  return kpis;
}

              <span>${escapeHtml(item.name)}</span>

            return `<td style="${colStyle} cursor:pointer;" onclick="openBudgetValueModal('${item.id}','${key}')" title="Clique para editar">

            </td>`;
          }).join('')}
          <td style="${colStyle} font-weight:600;">
            ${formatMoney(BUDGET_MONTHS.reduce((s,{key})=>s+getBudgetVal(item.id,key),0))}
          </td>
        </tr>
      `).join('')}
      ${groupItems.length === 0 ? `<tr><td colspan="${BUDGET_MONTHS.length + 2}" style="padding:6px 12px; color:var(--text-faint); font-size:12px; font-style:italic;">Nenhum item — clique em "+ Novo item" e selecione "${group.label}"</td></tr>` : ''}

  // Calcula total de receita por mês (para a linha de subtotal)

  return `

              const v = kpis[key].deducaoAuto;
              return `<td style="${colStyle} color:var(--text-faint);">${v > 0 ? formatMoney(v) : '—'}</td>`;

            <td style="${colStyle} color:var(--text-faint);">${formatMoney(Object.values(kpis).reduce((s,k)=>s+k.deducaoAuto,0))}</td>
          </tr>

          ${renderKpiRow('Resultado Operacional', 'resultadoOp')}

        </tbody>

    </div>

/* Modal: novo item / editar item da DRE orçamentária */
function openBudgetItemModal(itemId = null){
  const kind = state.entityKind;
  const editing = itemId ? state.budgetItems.find(i => i.id === itemId) : null;

  const groupOptions = BUDGET_GROUPS.map(g =>
    `<option value="${g.key}" ${editing?.group_type === g.key ? 'selected' : ''}>${g.label}</option>`
  ).join('');

async function submitBudgetItem(editingId){
  const entity = state.entities?.find(e => e.kind === 'pj') || state.entities?.[0];
  const name = document.getElementById('biName').value.trim();
  const groupType = document.getElementById('biGroup').value;
  if (!name) { toast('Informe o nome do item.', 'error'); return; }

  try {
    let itemId = editingId;

    if (editingId) {
      // edição simples — só atualiza nome e grupo
      const { error } = await supabaseClient.from('budget_items').update({ name, group_type: groupType }).eq('id', editingId);
      if (error) throw error;
      toast('Item atualizado.');
    } else {
      const amount = parseFloat(document.getElementById('biAmount')?.value) || 0;
      const startMonth = document.getElementById('biStartMonth')?.value;
      const recurring = document.getElementById('biRecurring')?.checked;
      const nMonths = recurring ? Math.min(13, parseInt(document.getElementById('biMonths')?.value) || 13) : 1;

      // Verifica se já existe item com mesmo nome e grupo — se sim, soma na linha existente
      const existing = state.budgetItems.find(i =>
        i.name.trim().toLowerCase() === name.toLowerCase() &&
        i.group_type === groupType
      );

      if (existing) {
        // Usa a linha existente — só insere/soma os valores
        itemId = existing.id;
        toast(`Somando na linha existente "${existing.name}".`);
      } else {
        // Cria nova linha
        const { data, error } = await supabaseClient.from('budget_items')
          .insert({ entity_id: entity.id, name, group_type: groupType })
          .select().single();
        if (error) throw error;
        itemId = data.id;
      }

      // Insere/soma valores nos meses escolhidos
      if (amount > 0 && startMonth) {
        const startIdx = BUDGET_MONTHS.findIndex(m => m.key === startMonth);
        const monthsToFill = BUDGET_MONTHS.slice(startIdx, startIdx + nMonths);

        // Para cada mês, soma com o valor já existente (upsert somando)
        const upsertRows = await Promise.all(monthsToFill.map(async m => {
          const currentVal = state.budgetValues[itemId]?.[m.key] || 0;
          return { budget_item_id: itemId, year_month: m.key, amount: currentVal + amount };
        }));

        const { error: ve } = await supabaseClient.from('budget_values')
          .upsert(upsertRows, { onConflict: 'budget_item_id,year_month' });
        if (ve) throw ve;

        if (!existing) toast(`Item criado${recurring ? ` e repetido por ${nMonths} mês${nMonths > 1 ? 'es' : ''}` : ''}.`);
        else toast(`Valores somados em ${monthsToFill.length} mês${monthsToFill.length > 1 ? 'es' : ''} na linha "${name}".`);
      } else {
        if (!existing) toast('Item criado.');
      }
    }

    closeModal();
    await loadBudget();
    render();
  } catch (err) {
    toast('Erro ao salvar: ' + err.message, 'error');
  }
}

async function deleteBudgetItem(id){
  if (!confirm('Excluir esta linha da DRE orçamentária? Os valores também serão apagados.')) return;
  try {
    const { error } = await supabaseClient.from('budget_items').update({ is_active: false }).eq('id', id);
    if (error) throw error;
    toast('Item removido.');
    closeModal();
    await loadBudget();
    render();

}

function renderDreCompareRow(label, previsto, realizado, isExpense = false){
  const remaining = Math.abs(previsto - realizado);
  // Receita/resultado: realizado < previsto = vermelho (não bateu ainda).
  // Despesa: realizado > previsto = vermelho (passou do esperado).
  const metOrBeat = isExpense ? (realizado <= previsto) : (realizado >= previsto);
  const colorClass = metOrBeat ? 'in' : 'out';
  return `
    <tr>
      <td>${label}</td>
      <td class="amount" style="text-align:right;">${formatMoney(previsto)}</td>
      <td class="amount" style="text-align:right;">${formatMoney(realizado)}</td>
      <td class="amount ${colorClass}" style="text-align:right;">${formatMoney(remaining)}</td>
    </tr>
  `;
}

/* ============================================================
   PÁGINA: PROJEÇÃO (cenário futuro — isolado do fluxo real)
   ============================================================ */

/* Um item está em atraso quando tem data original e ela já passou */
function isProjectionOverdue(item){
  if (!item.original_due_date) return false;
  const today = new Date().toISOString().slice(0,10);
  return item.original_due_date < today;
}

function renderProjecao(){
  const items = state.projectionItems;

  if (items.length === 0) {
    return `
      <div class="bridge-note" style="margin-bottom:16px;">
        <span>ℹ</span>
        <span>Essa área é um espaço de simulação, totalmente separado do fluxo de caixa real. Os itens aqui não entram na Visão Competência, Visão Caixa, Faturamento ou Saldos — servem só para você projetar cenários futuros.</span>
      </div>
      <div class="empty-state">
        <div class="empty-state-title">Nenhum item de projeção ainda</div>
        <div>Clique em "+ Novo item de projeção" para começar.</div>
      </div>
    `;
  }

  // ordena por vencimento previsto
  const sorted = [...items].sort((a,b) => a.due_date.localeCompare(b.due_date));

  const totalEntradas = items.filter(i => i.flow_type === 'entrada').reduce((s,i) => s + Number(i.amount), 0);
  const totalSaidas = items.filter(i => i.flow_type === 'saida').reduce((s,i) => s + Number(i.amount), 0);
  const saldoProjetado = totalEntradas - totalSaidas;
  const emAtraso = items.filter(isProjectionOverdue);

  // saldo acumulado mês a mês, para o gráfico
  const byMonth = {};
  sorted.forEach(i => {
    const key = i.due_date.slice(0,7); // YYYY-MM
    if (!byMonth[key]) byMonth[key] = { entrada: 0, saida: 0 };
    byMonth[key][i.flow_type] += Number(i.amount);
  });
  const monthKeys = Object.keys(byMonth).sort();
  let acumulado = 0;
  const evolucao = monthKeys.map(key => {
    acumulado += byMonth[key].entrada - byMonth[key].saida;
    const [y,m] = key.split('-');
    return { label: `${MONTH_NAMES[Number(m)-1].slice(0,3)}/${y.slice(2)}`, saldo: acumulado };
  });

  return `
    <div class="bridge-note" style="margin-bottom:16px;">
      <span>ℹ</span>
      <span>Espaço de simulação — não entra na Visão Competência, Visão Caixa, Faturamento ou Saldos reais.</span>
    </div>

    <div class="kpi-row">
      <div class="kpi-card">
        <div class="kpi-label">Total a receber (projeção)</div>
        <div class="kpi-value positive">${formatMoney(totalEntradas)}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Total a pagar (projeção)</div>
        <div class="kpi-value negative">${formatMoney(totalSaidas)}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Saldo projetado</div>
        <div class="kpi-value ${saldoProjetado >= 0 ? 'positive' : 'negative'}">${formatMoney(saldoProjetado)}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Em atraso</div>
        <div class="kpi-value" style="color:${emAtraso.length > 0 ? 'var(--danger)' : 'var(--text)'};">${emAtraso.length}</div>
        <div class="kpi-sub">${emAtraso.length > 0 ? formatMoney(emAtraso.reduce((s,i)=>s+Number(i.amount),0)) : 'Nada atrasado'}</div>
      </div>
    </div>

    ${evolucao.length > 1 ? `
      <div class="panel" style="margin-bottom:14px;">
        <div class="panel-header"><div class="panel-title">Evolução do saldo projetado</div></div>
        <div style="padding:16px;">${renderProjectionLineChart(evolucao)}</div>
      </div>
    ` : ''}

    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">Itens de projeção</div>
        <span class="cat-pill">${items.length}</span>
      </div>
      <table>
        <thead><tr><th>Vencimento</th><th>Descrição</th><th>Categoria</th><th>Situação</th><th style="text-align:right;">Valor</th></tr></thead>
        <tbody>
          ${sorted.map(i => renderProjectionRow(i)).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function renderProjectionRow(item){
  const overdue = isProjectionOverdue(item);
  const catName = item.categories?.name || '—';
  return `
    <tr onclick="openProjectionModal('${item.id}')" style="cursor:pointer; ${overdue ? 'background:var(--danger-soft);' : ''}" title="Clique para editar">
      <td>${formatDate(item.due_date)}</td>

      <td class="amount ${item.flow_type === 'entrada' ? 'in' : 'out'}" style="text-align:right;">

      </td>

/* Gráfico de linha simples (SVG) — evolução do saldo projetado acumulado */
function renderProjectionLineChart(points){
  const W = 600, H = 160, padL = 50, padR = 16, padTop = 16, padBottom = 28;
  const values = points.map(p => p.saldo);
  const max = Math.max(...values, 0);
  const min = Math.min(...values, 0);
  const range = (max - min) || 1;

  const stepX = (W - padL - padR) / Math.max(points.length - 1, 1);
  const yFor = (v) => padTop + (H - padTop - padBottom) * (1 - (v - min) / range);
  const xFor = (i) => padL + i * stepX;

  const linePath = points.map((p,i) => `${i===0?'M':'L'} ${xFor(i).toFixed(1)} ${yFor(p.saldo).toFixed(1)}`).join(' ');
  const zeroY = yFor(0);

  const dots = points.map((p,i) => `
    <circle cx="${xFor(i).toFixed(1)}" cy="${yFor(p.saldo).toFixed(1)}" r="3.5" fill="${p.saldo >= 0 ? 'var(--pj)' : 'var(--danger)'}">
      <title>${p.label}: ${formatMoney(p.saldo)}</title>
    </circle>
  `).join('');

  const labels = points.map((p,i) => `
    <text x="${xFor(i).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="9.5" fill="var(--text-faint)" font-family="var(--font-body)">${p.label}</text>
  `).join('');

  return `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; display:block;">
      <line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${W-padR}" y2="${zeroY.toFixed(1)}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 3" />
      <path d="${linePath}" fill="none" stroke="var(--pj)" stroke-width="2" />
      ${dots}
      ${labels}
    </svg>
  `;
}
