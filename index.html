          <div>O % médio de conversão para caixa está zerado — feche mais vendas para habilitar essa simulação.</div>
        </div>
      </div>
    `;
  }

  const desired = window._goalDesiredRevenue;
  let resultHtml = '';

  if (desired !== null && desired > 0) {
    const faturamentoNecessario = desired / (conversion.avgFirstPct / 100);
    const dre = computeCompetenceDRE(faturamentoNecessario);
    const acimaDoPE = faturamentoNecessario - dre.pontoEquilibrio;

    resultHtml = `
      <div class="kpi-row" style="grid-template-columns:repeat(3, 1fr); margin-top:14px;">
        <div class="kpi-card">
          <div class="kpi-label">Faturamento necessário</div>
          <div class="kpi-value positive">${formatMoney(faturamentoNecessario)}</div>

        </div>

          <div class="kpi-value ${dre.ebit >= 0 ? 'positive' : 'negative'}">${formatMoney(dre.ebit)}</div>
          <div class="kpi-sub">${dre.pctEbit.toFixed(1)}% sobre o faturamento</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Vs. Ponto de Equilíbrio</div>
          <div class="kpi-value ${acimaDoPE >= 0 ? 'positive' : 'negative'}">${acimaDoPE >= 0 ? '+' : ''}${formatMoney(acimaDoPE)}</div>
          <div class="kpi-sub">${acimaDoPE >= 0 ? 'acima' : 'abaixo'} do PE (${formatMoney(dre.pontoEquilibrio)})</div>
        </div>
      </div>
    `;
  }

  return `
    <div class="panel" style="margin-bottom:18px;">
      <div class="panel-header"><div class="panel-title">Quanto preciso faturar?</div></div>
      <div style="padding:16px;">

          Informe quanto deseja receber em caixa no mês — o cálculo usa o % médio de conversão (${conversion.avgFirstPct.toFixed(0)}%) para estimar o faturamento necessário.
        </div>
        <div style="display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap;">
          <div class="field" style="max-width:220px;">
            <label for="goalRevenueInput">Receita desejada (R$)</label>
            <input type="number" id="goalRevenueInput" step="100" min="0" placeholder="Ex: 20000" value="${desired || ''}">
          </div>
          <button class="btn btn-primary ${state.entityKind}" onclick="calculateGoalSimulation()">Calcular</button>
        </div>
        ${resultHtml}
      </div>
    </div>
  `;
}

  render();

function renderFaturamento(){
  const sales = filteredSales();
  const fechadas = sales.filter(s => s.status === 'fechada');
  const propostas = sales.filter(s => s.status === 'proposta');
  const faturamentoTotal = fechadas.reduce((s,v) => s + Number(v.total_amount), 0);
  const potencialPropostas = propostas.reduce((s,v) => s + Number(v.total_amount), 0);

  // receita recebida do período: soma das parcelas dessas vendas cujo lançamento já foi realizado
  const receitaRecebida = fechadas.reduce((sum, sale) => {
    const recebido = (sale.sale_installments || [])
      .filter(i => i.transaction_id && state.transactions.find(t => t.id === i.transaction_id && t.status === 'realizado'))
      .reduce((s,i) => s + Number(i.amount), 0);
    return sum + recebido;
  }, 0);

  // análise por produto/categoria (como na aba Vendas da planilha)
  const byProduct = {};
  fechadas.forEach(s => {
    const name = s.categories?.name || 'Sem categoria';
    byProduct[name] = (byProduct[name] || 0) + Number(s.total_amount);
  });
  const productRows = Object.entries(byProduct).sort((a,b) => b[1]-a[1]);

  const conversion = computeFaturamentoCaixaConversion();

  return `
    ${renderPeriodSelector()}

    <div class="kpi-row">

function openSaleModal(saleId = null){
  const kind = state.entityKind;
  const editing = saleId ? state.sales.find(s => s.id === saleId) : null;
  const today = new Date().toISOString().slice(0,10);

  const revenueGroups = state.groups.filter(g => g.flow_type === 'entrada');
  const clientOptions = state.clients.map(c => `<option value="${c.id}" ${editing?.client_id===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('');
  const categoryOptions = revenueGroups.map(g => `<optgroup label="${escapeHtml(g.name)}">${(g.categories||[]).map(c =>
    `<option value="${c.id}" ${editing?.category_id===c.id?'selected':''}>${escapeHtml(c.name)}</option>`
  ).join('')}</optgroup>`).join('');

  const isClosed = editing && editing.status === 'fechada';

  // Saldo não lançado: diferença entre o valor total da venda e o que já tem parcela/lançamento gerado
  const installmentsSum = isClosed ? (editing.sale_installments || []).reduce((s,i) => s + Number(i.amount), 0) : 0;
  const unallocated = isClosed ? Math.round((Number(editing.total_amount) - installmentsSum) * 100) / 100 : 0;

  const host = document.getElementById('modal-host');
  host.innerHTML = `
    <div class="modal-overlay" id="saleModalOverlay">
      <div class="modal">
        <div class="modal-header">
          <div class="modal-title">${editing ? 'Venda / Proposta' : 'Nova venda / proposta'}</div>
          <button class="btn btn-ghost btn-sm" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">
          ${isClosed ? `
            <div class="bridge-note"><span>✓</span><span>Venda fechada — as parcelas já foram geradas no fluxo de caixa. Valor e parcelamento não podem mais ser alterados aqui.</span></div>
          ` : ''}

          ${isClosed && Math.abs(unallocated) > 0.01 ? `
            <div class="bridge-note" style="border-color:var(--warn); background:var(--warn-soft);">
              <span>⚠</span>
              <span>
                ${formatMoney(unallocated)} dessa venda ainda não tem lançamento no fluxo de caixa
                (provavelmente parcelas futuras de um contrato em andamento). Use "Adicionar parcelas restantes" abaixo para completar.
              </span>
            </div>
          ` : ''}

          <div class="field">
            <label for="saleClient">Cliente</label>
            <select id="saleClient">
              <option value="">— sem cliente vinculado —</option>
              ${clientOptions}
            </select>
          </div>
          <div class="field">
            <label for="saleDescription">Descrição</label>
            <input type="text" id="saleDescription" placeholder="Ex: Consultoria 3 meses" value="${editing ? escapeHtml(editing.description) : ''}" ${isClosed?'disabled':''}>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="saleCategory">Produto / Categoria de receita</label>
              <select id="saleCategory" ${isClosed?'disabled':''}>
                <option value="">— selecione —</option>
                ${categoryOptions}
              </select>
            </div>
            <div class="field">
              <label for="saleAmount">Valor total (R$)</label>
              <input type="number" id="saleAmount" step="0.01" min="0" value="${editing ? editing.total_amount : ''}" ${isClosed?'disabled':''}>
            </div>
          </div>
          <div class="field">
            <label for="saleDate">Data da venda (competência)</label>
            <input type="date" id="saleDate" value="${editing ? editing.date_competencia : today}" ${isClosed?'disabled':''}>
          </div>

          ${editing ? `
            <div class="field">
              <label>Status atual</label>
              <span class="status-pill ${SALE_STATUS_CLASS[editing.status]}" style="width:fit-content;">${SALE_STATUS_LABELS[editing.status]}</span>
            </div>
          ` : ''}

          ${isClosed && (editing.sale_installments || []).length > 0 ? `
            <div class="field">
              <label>Parcelas geradas</label>
              <table style="margin-top:4px;">
                <thead><tr><th>Parc.</th><th>Vencimento</th><th style="text-align:right;">Valor</th><th>Status</th></tr></thead>
                <tbody>
                  ${editing.sale_installments.sort((a,b)=>a.installment_number-b.installment_number).map(i => {
                    const tx = state.transactions.find(t => t.id === i.transaction_id);
                    return `<tr>
                      <td>${i.installment_number === 0 ? 'Entrada' : i.installment_number}</td>
                      <td>${formatDate(i.due_date)}</td>
                      <td class="amount" style="text-align:right;">${formatMoney(i.amount)}</td>
                      <td><span class="status-pill ${tx?.status==='realizado' ? 'realizado' : 'previsto'}">${tx?.status==='realizado' ? 'Recebido' : 'Previsto'}</span></td>
                    </tr>`;
                  }).join('')}
                </tbody>
              </table>
            </div>
          ` : ''}
        </div>
        <div class="modal-footer">
          ${editing && editing.status === 'proposta' ? `<button class="btn btn-ghost" style="color:var(--danger); margin-right:auto;" onclick="deleteSale('${editing.id}')">Excluir</button>` : ''}
          ${editing && editing.status === 'proposta' ? `<button class="btn" style="background:var(--pj-soft); border-color:var(--pj); color:var(--pj);" onclick="openCloseSaleModal('${editing.id}')">Marcar como Fechada</button>` : ''}
          ${isClosed && Math.abs(unallocated) > 0.01 ? `<button class="btn" style="background:var(--warn-soft); border-color:var(--warn); color:var(--warn);" onclick="openCompleteInstallmentsModal('${editing.id}')">+ Adicionar parcelas restantes</button>` : ''}
          ${isClosed ? `<button class="btn btn-ghost" style="color:var(--danger);" onclick="reopenSaleForEdit('${editing.id}')">Editar venda fechada</button>` : ''}
          <button class="btn btn-ghost" onclick="closeModal()">${isClosed ? 'Fechar' : 'Cancelar'}</button>
          ${!isClosed ? `<button class="btn btn-primary ${kind}" onclick="submitSale(${editing ? `'${editing.id}'` : 'null'})">Salvar</button>` : ''}
        </div>
      </div>
    </div>
  `;
  document.getElementById('saleModalOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'saleModalOverlay') closeModal();
  });
}

async function submitSale(editingId){
  const entity = currentEntity();
  const clientId = document.getElementById('saleClient').value || null;
  const description = document.getElementById('saleDescription').value.trim();
  const categoryId = document.getElementById('saleCategory').value || null;
  const amount = parseFloat(document.getElementById('saleAmount').value);
  const date = document.getElementById('saleDate').value;

  if (!description) { toast('Informe uma descrição.', 'error'); return; }
  if (!amount || amount <= 0) { toast('Informe um valor válido.', 'error'); return; }
  if (!date) { toast('Informe a data.', 'error'); return; }

  const payload = { entity_id: entity.id, client_id: clientId, category_id: categoryId, description, total_amount: amount, date_competencia: date };

  try {
    if (editingId) {
      const { error } = await supabaseClient.from('sales').update(payload).eq('id', editingId);
      if (error) throw error;
      toast('Venda atualizada.');
    } else {
      const { error } = await supabaseClient.from('sales').insert({ ...payload, status: 'proposta' });
      if (error) throw error;
      toast('Proposta criada.');
    }
    closeModal();
    await loadEntityData();
    render();
  } catch (err) {
    toast('Erro ao salvar venda: ' + err.message, 'error');
  }
}

async function deleteSale(id){
  if (!confirm('Excluir esta proposta?')) return;
  try {
    const { error } = await supabaseClient.from('sales').delete().eq('id', id);
    if (error) throw error;
    toast('Proposta excluída.');
    closeModal();
    await loadEntityData();
    render();
  } catch (err) {
    toast('Erro ao excluir: ' + err.message, 'error');
  }
}

/* ============================================================
   FECHAR VENDA: pede entrada + nº de parcelas, gera lançamentos
   previstos no fluxo de caixa, todos linkados à venda.
   ============================================================ */
function openCloseSaleModal(saleId){
  const sale = state.sales.find(s => s.id === saleId);
  if (!sale) return;
  const kind = state.entityKind;
  const today = new Date().toISOString().slice(0,10);

  window._closeSaleMode = 'new'; // 'new' | 'link'
  window._linkedTxIds = new Set();

  const host = document.getElementById('modal-host');
  host.innerHTML = `
    <div class="modal-overlay" id="closeSaleModalOverlay">
      <div class="modal">
        <div class="modal-header">
          <div class="modal-title">Fechar venda — ${formatMoney(sale.total_amount)}</div>
          <button class="btn btn-ghost btn-sm" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">
          <div class="flow-toggle" id="closeSaleModeToggle">
            <button type="button" class="active in" data-mode="new" onclick="setCloseSaleMode('${saleId}', 'new')">Gerar novos lançamentos</button>
            <button type="button" data-mode="link" onclick="setCloseSaleMode('${saleId}', 'link')">Vincular a lançamentos existentes</button>
          </div>
          <div id="closeSaleModeBody"></div>
        </div>
        <div class="modal-footer" id="closeSaleModalFooter">
          <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
          <button class="btn btn-primary ${kind}" onclick="confirmCloseSale('${saleId}')">Confirmar e gerar lançamentos</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('closeSaleModalOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'closeSaleModalOverlay') closeModal();
  });
  renderCloseSaleModeBody(saleId);
}

function setCloseSaleMode(saleId, mode){
  window._closeSaleMode = mode;
  document.querySelectorAll('#closeSaleModeToggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  renderCloseSaleModeBody(saleId);
}

function renderCloseSaleModeBody(saleId){
  const sale = state.sales.find(s => s.id === saleId);
  const mode = window._closeSaleMode;
  const today = new Date().toISOString().slice(0,10);
  const body = document.getElementById('closeSaleModeBody');
  const footer = document.getElementById('closeSaleModalFooter');
  const kind = state.entityKind;

  if (mode === 'new') {
    body.innerHTML = `
      <div class="bridge-note" style="margin-top:14px;">
        <span>ℹ</span>
        <span>Informe a entrada (se houver) e em quantas parcelas o restante será dividido. O sistema cria os lançamentos previstos no fluxo de caixa automaticamente.</span>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="closeEntryAmount">Valor de entrada (R$)</label>
          <input type="number" id="closeEntryAmount" step="0.01" min="0" value="0" oninput="updateInstallmentPreview('${saleId}')">
        </div>
        <div class="field">
          <label for="closeEntryDate">Data da entrada</label>
          <input type="date" id="closeEntryDate" value="${today}">
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="closeInstallmentCount">Nº de parcelas restantes</label>
          <input type="number" id="closeInstallmentCount" min="1" max="36" value="1" oninput="updateInstallmentPreview('${saleId}')">
        </div>
        <div class="field">
          <label for="closeFirstDueDate">1º vencimento</label>
          <input type="date" id="closeFirstDueDate" value="${today}" oninput="updateInstallmentPreview('${saleId}')">
        </div>
      </div>

      <div class="field">
        <label for="closeInterval">Intervalo entre parcelas (dias)</label>
        <input type="number" id="closeInterval" min="1" value="30" oninput="updateInstallmentPreview('${saleId}')">
      </div>

      <div id="installmentPreviewHost"></div>
    `;
    footer.innerHTML = `
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary ${kind}" onclick="confirmCloseSale('${saleId}')">Confirmar e gerar lançamentos</button>
    `;
    updateInstallmentPreview(saleId);
  } else {
    // Modo vínculo: lista lançamentos de ENTRADA já existentes, sem venda vinculada ainda,
    // pra marcar quais compõem essa venda histórica (vindos de OFX, por exemplo).
    const candidates = state.transactions.filter(t =>
      t.flow_type === 'entrada' && !t.sale_installment_id
    ).sort((a,b) => (b.date_realizado || b.date_competencia).localeCompare(a.date_realizado || a.date_competencia));

    const selectedTotal = Array.from(window._linkedTxIds)
      .map(id => candidates.find(c => c.id === id))
      .filter(Boolean)
      .reduce((s,t) => s + Number(t.amount), 0);
    const diff = Number(sale.total_amount) - selectedTotal;

    body.innerHTML = `
      <div class="bridge-note" style="margin-top:14px;">
        <span>ℹ</span>
        <span>Use isso para histórico já importado via OFX: marque os lançamentos que correspondem a essa venda, sem criar duplicados no fluxo de caixa.</span>
      </div>

      <div class="field" style="margin-top:10px;">
        <label for="closeLinkSearch">Buscar por descrição</label>
        <input type="text" id="closeLinkSearch" placeholder="Filtrar..." oninput="renderCloseSaleLinkList('${saleId}', this.value)">
      </div>

      <div id="closeSaleLinkListHost" style="max-height:260px; overflow-y:auto; margin-top:10px; border:1px solid var(--border); border-radius:var(--radius-sm);"></div>

      <div style="margin-top:12px; padding:10px 12px; background:var(--bg-card); border-radius:var(--radius-sm); font-size:12.5px; display:flex; justify-content:space-between;">
        <span>Total selecionado: <strong class="amount">${formatMoney(selectedTotal)}</strong></span>
        <span style="color:${Math.abs(diff) > 0.01 ? 'var(--danger)' : 'var(--pj)'};">
          ${Math.abs(diff) > 0.01 ? `Falta ${formatMoney(diff)} para bater com o total da venda` : '✓ Bate com o total da venda'}
        </span>
      </div>
    `;
    footer.innerHTML = `
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary ${kind}" onclick="confirmCloseSaleLinked('${saleId}')">Confirmar vínculo</button>
    `;
    renderCloseSaleLinkList(saleId, '');
  }
}

function renderCloseSaleLinkList(saleId, search){
  const candidates = state.transactions.filter(t =>
    t.flow_type === 'entrada' && !t.sale_installment_id &&
    (!search || t.description.toLowerCase().includes(search.toLowerCase()))
  ).sort((a,b) => (b.date_realizado || b.date_competencia).localeCompare(a.date_realizado || a.date_competencia));

  const host = document.getElementById('closeSaleLinkListHost');
  if (candidates.length === 0) {
    host.innerHTML = `<div style="padding:16px; text-align:center; color:var(--text-faint); font-size:12.5px;">Nenhum lançamento de entrada disponível${search ? ' para essa busca' : ''}.</div>`;
    return;
  }

  host.innerHTML = candidates.map(t => {
    const checked = window._linkedTxIds.has(t.id);
    return `
      <label style="display:flex; align-items:center; gap:10px; padding:9px 12px; border-bottom:1px solid var(--border); cursor:pointer; font-size:13px;">
        <input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleLinkTx('${saleId}', '${t.id}')" style="width:15px; height:15px; flex-shrink:0;">
        <span style="flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(t.description)}</span>
        <span style="color:var(--text-faint); font-size:11.5px; flex-shrink:0;">${formatDate(t.date_realizado || t.date_competencia)}</span>
        <span class="amount in" style="flex-shrink:0;">${formatMoney(t.amount)}</span>
      </label>
    `;
  }).join('');
}

function toggleLinkTx(saleId, txId){
  if (window._linkedTxIds.has(txId)) window._linkedTxIds.delete(txId);
  else window._linkedTxIds.add(txId);
  renderCloseSaleModeBody(saleId);
  // mantém o texto de busca atual
  const search = document.getElementById('closeLinkSearch');
  if (search) renderCloseSaleLinkList(saleId, search.value);
}

async function confirmCloseSaleLinked(saleId){
  const sale = state.sales.find(s => s.id === saleId);
  if (!sale) return;
  const ids = Array.from(window._linkedTxIds);

  if (ids.length === 0) { toast('Selecione ao menos um lançamento para vincular.', 'error'); return; }

  try {
    const { error: saleError } = await supabaseClient.from('sales').update({ status: 'fechada' }).eq('id', saleId);
    if (saleError) throw saleError;

    const selectedTxs = ids.map(id => state.transactions.find(t => t.id === id)).filter(Boolean);

    for (let i = 0; i < selectedTxs.length; i++) {
      const tx = selectedTxs[i];
      const { data: instData, error: instError } = await supabaseClient.from('sale_installments').insert({
        sale_id: saleId,
        installment_number: i + 1,
        amount: tx.amount,
        due_date: tx.date_realizado || tx.date_competencia,
        transaction_id: tx.id
      }).select().single();
      if (instError) throw instError;

      const { error: txError } = await supabaseClient.from('transactions').update({ sale_installment_id: instData.id }).eq('id', tx.id);
      if (txError) throw txError;
    }

    toast(`Venda fechada e vinculada a ${selectedTxs.length} lançamento(s) existente(s).`);
    closeModal();
    await loadEntityData();
    render();
  } catch (err) {
    console.error(err);
    toast('Erro ao vincular venda: ' + err.message, 'error');
  }
}

/* ============================================================
   COMPLETAR PARCELAS RESTANTES
   Para vendas fechadas com saldo não lançado (ex: contrato com
   parcelas futuras que ainda não existem no fluxo de caixa,
   normalmente vindas do vínculo com histórico OFX que só linkou
   o que já tinha sido pago). Gera lançamentos PREVISTOS só para
   o saldo que falta, sem mexer no que já está vinculado.
   ============================================================ */
function openCompleteInstallmentsModal(saleId){
  const sale = state.sales.find(s => s.id === saleId);
  if (!sale) return;
  const kind = state.entityKind;
  const today = new Date().toISOString().slice(0,10);

  const installmentsSum = (sale.sale_installments || []).reduce((s,i) => s + Number(i.amount), 0);
  const unallocated = Math.round((Number(sale.total_amount) - installmentsSum) * 100) / 100;
  const nextInstallmentNumber = Math.max(0, ...(sale.sale_installments || []).map(i => i.installment_number)) + 1;

  const host = document.getElementById('modal-host');
  host.innerHTML = `
    <div class="modal-overlay" id="completeInstModalOverlay">
      <div class="modal">
        <div class="modal-header">
          <div class="modal-title">Adicionar parcelas restantes</div>
          <button class="btn btn-ghost btn-sm" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">
          <div class="bridge-note">
            <span>ℹ</span>
            <span>Saldo ainda não lançado dessa venda: <strong>${formatMoney(unallocated)}</strong>. Informe em quantas parcelas dividir e as datas de vencimento — o sistema cria lançamentos previstos, sem duplicar o que já existe.</span>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="compInstCount">Nº de parcelas</label>
              <input type="number" id="compInstCount" min="1" max="36" value="1" oninput="updateCompleteInstallmentPreview('${saleId}')">
            </div>
            <div class="field">
              <label for="compInstFirstDue">1º vencimento</label>
              <input type="date" id="compInstFirstDue" value="${today}" oninput="updateCompleteInstallmentPreview('${saleId}')">
            </div>
          </div>
          <div class="field">
            <label for="compInstInterval">Intervalo entre parcelas (dias)</label>
            <input type="number" id="compInstInterval" min="1" value="30" oninput="updateCompleteInstallmentPreview('${saleId}')">
          </div>

          <div id="completeInstallmentPreviewHost"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
          <button class="btn btn-primary ${kind}" onclick="confirmCompleteInstallments('${saleId}', ${nextInstallmentNumber})">Confirmar e gerar lançamentos</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('completeInstModalOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'completeInstModalOverlay') closeModal();
  });
  updateCompleteInstallmentPreview(saleId);
}

function computeRemainingInstallments(unallocated){
  const count = Math.max(1, parseInt(document.getElementById('compInstCount')?.value) || 1);
  const firstDue = document.getElementById('compInstFirstDue')?.value;
  const interval = Math.max(1, parseInt(document.getElementById('compInstInterval')?.value) || 30);

  const installments = [];
  const base = Math.floor((unallocated / count) * 100) / 100;
  let allocated = 0;
  for (let i = 0; i < count; i++) {
    const isLast = i === count - 1;
    const amount = isLast ? Math.round((unallocated - allocated) * 100) / 100 : base;
    allocated += amount;
    const due = new Date(firstDue);
    due.setDate(due.getDate() + interval * i);
    installments.push({ amount, due_date: due.toISOString().slice(0,10) });
  }
  return installments;
}

function updateCompleteInstallmentPreview(saleId){
  const sale = state.sales.find(s => s.id === saleId);
  if (!sale) return;
  const installmentsSum = (sale.sale_installments || []).reduce((s,i) => s + Number(i.amount), 0);
  const unallocated = Math.round((Number(sale.total_amount) - installmentsSum) * 100) / 100;

  const installments = computeRemainingInstallments(unallocated);
  const host = document.getElementById('completeInstallmentPreviewHost');
  host.innerHTML = `
    <div class="field">
      <label>Prévia das parcelas</label>
      <table style="margin-top:4px;">
        <thead><tr><th>Parc.</th><th>Vencimento</th><th style="text-align:right;">Valor</th></tr></thead>
        <tbody>
          ${installments.map((i,idx) => `<tr><td>${idx+1}</td><td>${formatDate(i.due_date)}</td><td class="amount" style="text-align:right;">${formatMoney(i.amount)}</td></tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}

async function confirmCompleteInstallments(saleId, startNumber){
  const sale = state.sales.find(s => s.id === saleId);
  if (!sale) return;
  const entity = currentEntity();

  const installmentsSum = (sale.sale_installments || []).reduce((s,i) => s + Number(i.amount), 0);
  const unallocated = Math.round((Number(sale.total_amount) - installmentsSum) * 100) / 100;

  if (unallocated <= 0) { toast('Não há saldo restante para lançar.', 'error'); return; }
  if (!sale.category_id) { toast('Essa venda não tem produto/categoria definida.', 'error'); return; }

  const installments = computeRemainingInstallments(unallocated);

  try {
    for (let i = 0; i < installments.length; i++) {
      const inst = installments[i];
      const instNumber = startNumber + i;
      const { data: txData, error: txError } = await supabaseClient.from('transactions').insert({
        entity_id: entity.id,
        category_id: sale.category_id,
        description: `${sale.description} (parcela ${instNumber})`,
        amount: inst.amount,
        flow_type: 'entrada',
        date_competencia: inst.due_date,
        date_realizado: null,
        status: 'previsto',
        source: 'manual'
      }).select().single();
      if (txError) throw txError;

      const { error: instError } = await supabaseClient.from('sale_installments').insert({
        sale_id: saleId,
        installment_number: instNumber,
        amount: inst.amount,
        due_date: inst.due_date,
        transaction_id: txData.id
      });
      if (instError) throw instError;
    }

    toast(`${installments.length} parcela(s) restante(s) lançada(s) no fluxo de caixa.`);
    closeModal();
    await loadEntityData();
    render();
  } catch (err) {
    console.error(err);
    toast('Erro ao lançar parcelas: ' + err.message, 'error');
  }
}

function computeInstallments(sale){
  const entryAmount = parseFloat(document.getElementById('closeEntryAmount')?.value) || 0;
  const entryDate = document.getElementById('closeEntryDate')?.value;
  const count = Math.max(1, parseInt(document.getElementById('closeInstallmentCount')?.value) || 1);
  const firstDue = document.getElementById('closeFirstDueDate')?.value;
  const interval = Math.max(1, parseInt(document.getElementById('closeInterval')?.value) || 30);

  const remaining = Math.max(0, Number(sale.total_amount) - entryAmount);
  const installments = [];

  if (entryAmount > 0) {
    installments.push({ installment_number: 0, amount: entryAmount, due_date: entryDate });
  }

  if (remaining > 0) {
    const base = Math.floor((remaining / count) * 100) / 100;
    let allocated = 0;
    for (let i = 0; i < count; i++) {
      const isLast = i === count - 1;
      const amount = isLast ? Math.round((remaining - allocated) * 100) / 100 : base;
      allocated += amount;
      const due = new Date(firstDue);
      due.setDate(due.getDate() + interval * i);
      installments.push({ installment_number: i + 1, amount, due_date: due.toISOString().slice(0,10) });
    }
  }

  return installments;
}

function updateInstallmentPreview(saleId){
  const sale = state.sales.find(s => s.id === saleId);
  if (!sale) return;
  const installments = computeInstallments(sale);
  const total = installments.reduce((s,i) => s + i.amount, 0);
  const diff = Math.round((Number(sale.total_amount) - total) * 100) / 100;

  const host = document.getElementById('installmentPreviewHost');
  host.innerHTML = `
    <div class="field">
      <label>Prévia das parcelas</label>
      <table style="margin-top:4px;">
        <thead><tr><th>Parc.</th><th>Vencimento</th><th style="text-align:right;">Valor</th></tr></thead>
        <tbody>
          ${installments.map(i => `<tr><td>${i.installment_number===0?'Entrada':i.installment_number}</td><td>${formatDate(i.due_date)}</td><td class="amount" style="text-align:right;">${formatMoney(i.amount)}</td></tr>`).join('')}
        </tbody>
      </table>
      ${Math.abs(diff) > 0.01 ? `<div style="font-size:11.5px; color:var(--danger); margin-top:6px;">Soma das parcelas difere do total da venda em ${formatMoney(Math.abs(diff))}. Ajustado automaticamente na última parcela.</div>` : ''}
    </div>
  `;
}

async function confirmCloseSale(saleId){
  const sale = state.sales.find(s => s.id === saleId);
  if (!sale) return;
  const entity = currentEntity();
  const installments = computeInstallments(sale);

  if (installments.length === 0) { toast('Nenhuma parcela a gerar.', 'error'); return; }

  // categoria padrão para os lançamentos: a mesma categoria da venda
  if (!sale.category_id) {
    toast('Essa venda não tem produto/categoria definida. Edite a venda antes de fechar.', 'error');
    return;
  }

  try {
    const { error: saleError } = await supabaseClient.from('sales').update({ status: 'fechada' }).eq('id', saleId);
    if (saleError) throw saleError;

    for (const inst of installments) {
      const { data: txData, error: txError } = await supabaseClient.from('transactions').insert({
        entity_id: entity.id,
        category_id: sale.category_id,
        description: `${sale.description}${inst.installment_number === 0 ? ' (entrada)' : ` (parcela ${inst.installment_number}/${installments.length - (installments.some(x=>x.installment_number===0)?1:0)})`}`,
        amount: inst.amount,
        flow_type: 'entrada',
        date_competencia: inst.due_date,
        date_realizado: null,
        status: 'previsto',
        source: 'manual'
      }).select().single();
      if (txError) throw txError;

      const { error: instError } = await supabaseClient.from('sale_installments').insert({
        sale_id: saleId,
        installment_number: inst.installment_number,
        amount: inst.amount,
        due_date: inst.due_date,
        transaction_id: txData.id
      });
      if (instError) throw instError;
    }

    toast(`Venda fechada! ${installments.length} lançamento(s) previsto(s) criado(s) no fluxo de caixa.`);
    closeModal();
    await loadEntityData();
    render();
  } catch (err) {
    console.error(err);
    toast('Erro ao fechar venda: ' + err.message, 'error');
  }
}

/* ============================================================
   REABRIR VENDA FECHADA PARA EDIÇÃO
   Apaga as parcelas e lançamentos gerados anteriormente (avisando
   se algum já foi conciliado/recebido de verdade) e volta a venda
   para status "proposta", para que valor/categoria/parcelamento
   possam ser refeitos pelo fluxo normal de fechamento.
   ============================================================ */
async function reopenSaleForEdit(saleId){
  const sale = state.sales.find(s => s.id === saleId);
  if (!sale) return;

  const installments = sale.sale_installments || [];
  const linkedTxs = installments
    .map(i => state.transactions.find(t => t.id === i.transaction_id))
    .filter(Boolean);

  const reconciled = linkedTxs.filter(t => t.status === 'realizado' || t.reconciliation_status === 'conciliado');

  let confirmMsg = `Isso vai apagar as ${installments.length} parcela(s) já geradas no fluxo de caixa e reabrir a venda como "Proposta", para você refazer valor e parcelamento do zero.`;

  if (reconciled.length > 0) {
    confirmMsg += `\n\n⚠ Atenção: ${reconciled.length} dessa(s) parcela(s) já está(ão) marcada(s) como recebida(s)/conciliada(s) no fluxo de caixa. Apagar agora vai desfazer esse recebimento também. Tem certeza que quer continuar?`;
  }

  if (!confirm(confirmMsg)) return;

  try {
    // apaga os lançamentos vinculados no fluxo de caixa
    const txIds = linkedTxs.map(t => t.id);
    if (txIds.length > 0) {
      const { error: txError } = await supabaseClient.from('transactions').delete().in('id', txIds);
      if (txError) throw txError;
    }

    // apaga as parcelas (transaction_id->set null não remove a linha sozinho)
    const { error: instError } = await supabaseClient.from('sale_installments').delete().eq('sale_id', saleId);
    if (instError) throw instError;

    const { error: saleError } = await supabaseClient.from('sales').update({ status: 'proposta' }).eq('id', saleId);
    if (saleError) throw saleError;

    toast('Venda reaberta. Ajuste os dados e feche novamente quando estiver pronto.');
    closeModal();
    await loadEntityData();
    openSaleModal(saleId);
  } catch (err) {
    console.error(err);
    toast('Erro ao reabrir venda: ' + err.message, 'error');
  }
}

/* ============================================================
   PÁGINA: SALDOS
   Saldo atual = saldo inicial + entradas realizadas − saídas
   realizadas, considerando apenas lançamentos com
   date_realizado >= initial_balance_date da conta.
   ============================================================ */
function renderSaldos(){
  if (state.accounts.length === 0) {
    return `<div class="empty-state"><div class="empty-state-title">Nenhuma conta cadastrada</div><div>Cadastre contas em "Contas" para ver os saldos aqui.</div></div>`;
  }

  const rows = state.accounts.map(a => {
    const relevant = state.transactions.filter(t =>
      t.account_id === a.id &&
      t.status === 'realizado' &&
      t.date_realizado &&
      t.date_realizado >= a.initial_balance_date
    );
    const entradas = relevant.filter(t => t.flow_type === 'entrada').reduce((s,t)=>s+Number(t.amount),0);
    const saidas = relevant.filter(t => t.flow_type === 'saida').reduce((s,t)=>s+Number(t.amount),0);
    const current = Number(a.initial_balance) + entradas - saidas;
    return { account: a, entradas, saidas, current };
  });

  const totalGeral = rows.reduce((s,r) => s + r.current, 0);

  return `
    <div class="kpi-row" style="grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); margin-bottom:18px;">
      ${rows.map(r => `
        <div class="kpi-card">
          <div class="kpi-label">${escapeHtml(r.account.name)}</div>
          <div class="kpi-value ${r.current >= 0 ? 'positive' : 'negative'}">${formatMoney(r.current)}</div>
          <div class="kpi-sub">desde ${formatDate(r.account.initial_balance_date)}</div>
        </div>
      `).join('')}
    </div>

    <div class="panel">
      <div class="panel-header"><div class="panel-title">Detalhamento por conta</div></div>
      <table>
        <thead><tr><th>Conta</th><th style="text-align:right;">Saldo inicial</th><th style="text-align:right;">Entradas</th><th style="text-align:right;">Saídas</th><th style="text-align:right;">Saldo atual</th></tr></thead>
        <tbody>
          ${rows.map(r => `
            <tr>
              <td>${escapeHtml(r.account.name)}</td>
              <td class="amount" style="text-align:right;">${formatMoney(r.account.initial_balance)}</td>
              <td class="amount in" style="text-align:right;">+ ${formatMoney(r.entradas)}</td>
              <td class="amount out" style="text-align:right;">− ${formatMoney(r.saidas)}</td>
              <td class="amount ${r.current >= 0 ? 'in' : 'out'}" style="text-align:right; font-weight:600;">${formatMoney(r.current)}</td>
            </tr>
          `).join('')}
        </tbody>
        <tfoot>
          <tr style="border-top:2px solid var(--border);">
            <td style="font-weight:600;">Total</td>
            <td></td><td></td><td></td>
            <td class="amount ${totalGeral >= 0 ? 'in' : 'out'}" style="text-align:right; font-weight:700;">${formatMoney(totalGeral)}</td>
          </tr>
        </tfoot>
      </table>
    </div>
  `;
}

/* ============================================================
   HELPERS: Anexo PDF (Base64)
   Reutilizado em Lançamentos e Impostos.
   ============================================================ */
function renderAttachmentField(base64 = null, name = null){
  return `
    <div class="field" id="attachmentField">
      <label>Anexo (PDF, até 3MB)</label>
      ${base64 ? `
        <div style="display:flex; align-items:center; gap:8px; padding:8px 10px; background:var(--bg-elevated); border-radius:var(--radius-sm); border:1px solid var(--border);">
          <span style="font-size:13px;">📄</span>
          <span style="font-size:12.5px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(name || 'Anexo')}</span>
          <button type="button" class="btn btn-ghost btn-sm" onclick="viewAttachment()" title="Visualizar">👁</button>
          <button type="button" class="btn btn-ghost btn-sm" style="color:var(--danger);" onclick="removeAttachment()" title="Remover">✕</button>
        </div>
        <input type="hidden" id="attachBase64" value="${base64}">
        <input type="hidden" id="attachName" value="${escapeHtml(name || '')}">
      ` : `
        <label for="attachFile" style="display:flex; align-items:center; gap:8px; padding:8px 12px; background:var(--bg-elevated); border:1px dashed var(--border); border-radius:var(--radius-sm); cursor:pointer; font-size:12.5px; color:var(--text-dim);">
          <span>📎</span> Clique para selecionar um PDF
        </label>
        <input type="file" id="attachFile" accept=".pdf,application/pdf" style="display:none;" onchange="loadAttachmentFile(this)">
        <input type="hidden" id="attachBase64" value="">
        <input type="hidden" id="attachName" value="">
      `}
      <div id="attachProgress" style="font-size:11.5px; color:var(--text-faint); margin-top:4px; display:none;">Carregando...</div>
    </div>
  `;
}

function loadAttachmentFile(input){
  const file = input.files[0];
  if (!file) return;
  if (file.size > 3 * 1024 * 1024) { toast('Arquivo muito grande — limite de 3MB.', 'error'); return; }
  const progress = document.getElementById('attachProgress');
  if (progress) { progress.style.display = 'block'; progress.textContent = 'Carregando...'; }

  const reader = new FileReader();
  reader.onload = (e) => {
    const base64 = e.target.result; // inclui o prefixo data:application/pdf;base64,...
    document.getElementById('attachBase64').value = base64;
    document.getElementById('attachName').value = file.name;
    // re-renderiza o campo com o arquivo carregado
    const field = document.getElementById('attachmentField');
    if (field) field.outerHTML = renderAttachmentField(base64, file.name);
    if (progress) progress.style.display = 'none';
  };
  reader.readAsDataURL(file);
}

function viewAttachment(){
  const base64 = document.getElementById('attachBase64')?.value;
  if (!base64) return;
  const win = window.open('');
  win.document.write(`<iframe src="${base64}" width="100%" height="100%" style="border:none;"></iframe>`);
}

function removeAttachment(){
  const field = document.getElementById('attachmentField');
  if (field) field.outerHTML = renderAttachmentField(null, null);
}

function viewSavedAttachment(base64, name){
  if (!base64) return;
  const win = window.open('');
  win.document.title = name || 'Anexo';
  win.document.write(`<iframe src="${base64}" width="100%" height="100%" style="border:none; position:fixed; top:0; left:0;"></iframe>`);
}

function closeModal(){
  document.getElementById('modal-host').innerHTML = '';
  window._editingTxId = null;
}

function setTxFlow(flow){
  window._txFlow = flow;
  document.querySelectorAll('#flowToggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.flow === flow);
  });
  populateGroupSelect();
}

function populateGroupSelect(preselectCategoryId = null){
  const flow = window._txFlow;
  const groups = state.groups.filter(g => g.flow_type === flow);
  const sel = document.getElementById('txGroup');

  // se editando, acha o grupo dono da categoria pré-selecionada
  let preselectGroupId = null;
  if (preselectCategoryId) {
    const owner = groups.find(g => (g.categories || []).some(c => c.id === preselectCategoryId));
    if (owner) preselectGroupId = owner.id;
  }

  sel.innerHTML = groups.map(g => `<option value="${g.id}" ${g.id === preselectGroupId ? 'selected' : ''}>${escapeHtml(g.name)}</option>`).join('');
  onTxGroupChange(preselectCategoryId);
}

function onTxGroupChange(preselectCategoryId = null){
  const groupId = document.getElementById('txGroup').value;
  const group = state.groups.find(g => g.id === groupId);
  const catSel = document.getElementById('txCategory');
  catSel.innerHTML = (group?.categories || []).map(c => `<option value="${c.id}" ${c.id === preselectCategoryId ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('');
  updateBridgeNote();
  catSel.onchange = updateBridgeNote;
}

/* Detecta se a categoria escolhida é "Pró-labore" (PJ) — mostra aviso de ponte */
function isBridgeCategory(){
  // Ponte PF<->PJ desativada — PF removida do sistema.
  // Será reestruturado quando implementar o modelo de Grupo Empresarial.
  return false;
}

function updateBridgeNote(){
  const host = document.getElementById('bridgeNoteHost');
  const flow = window._txFlow;
  if (flow === 'saida' && isBridgeCategory()) {
    host.innerHTML = `
      <div class="bridge-note">
        <span>⇄</span>
        <span>
          Esse pró-labore vai gerar automaticamente uma entrada espelhada na <strong>PF</strong>,
          marcada como <strong>"Aguardando conciliação"</strong>. Quando você importar o OFX da
          conta pessoal, o sistema tenta casar essa entrada com o lançamento real do extrato —
          assim evita duplicar quando o PIX aparecer no banco.
        </span>
      </div>
    `;
  } else {
    host.innerHTML = '';
  }
}

/* ============================================================
   SUBMIT: cria a transação (+ espelho, se aplicável)
   ============================================================ */
async function submitTransaction(){
  const entity = currentEntity();
  const editingId = window._editingTxId;
  const editing = editingId ? state.transactions.find(t => t.id === editingId) : null;
  const isLocked = editing && editing.source !== 'manual';

  const categoryId = document.getElementById('txCategory').value;
  if (!categoryId) { toast('Selecione uma categoria.', 'error'); return; }

  // Modo edição de lançamento "travado" (ofx/espelho): permite trocar
  // categoria e descrição, mas não valor/data (protege a conciliação)
  if (isLocked) {
    const description = document.getElementById('txDescription').value.trim();
    if (!description) { toast('Informe uma descrição.', 'error'); return; }
    try {
      const { error } = await supabaseClient.from('transactions').update({ category_id: categoryId, description }).eq('id', editingId);
      if (error) throw error;
      toast('Lançamento atualizado.');
      closeModal();
      await loadEntityData();
      render();
    } catch (err) {
      toast('Erro ao atualizar: ' + err.message, 'error');
    }
    return;
  }

  const description = document.getElementById('txDescription').value.trim();
  const amount = parseFloat(document.getElementById('txAmount').value);
  const date = document.getElementById('txDate').value;
  const accountId = document.getElementById('txAccount').value;
  const status = document.getElementById('txStatus').value;
  const flow = window._txFlow;

  if (!description) { toast('Informe uma descrição.', 'error'); return; }
  if (!amount || amount <= 0) { toast('Informe um valor válido.', 'error'); return; }
  if (!date) { toast('Informe a data.', 'error'); return; }

  const isBridge = !editing && flow === 'saida' && isBridgeCategory();

  const payload = {
    entity_id: entity.id,
    account_id: accountId || null,
    category_id: categoryId,
    description,
    amount,
    flow_type: flow,
    date_competencia: date,
    date_realizado: status === 'realizado' ? date : null,
    status,
    attachment_base64: document.getElementById('attachBase64')?.value || null,
    attachment_name: document.getElementById('attachName')?.value || null,
    original_due_date: document.getElementById('txDueDate')?.value || null,
  };

  try {
    if (editing) {
      const { error } = await supabaseClient.from('transactions').update(payload).eq('id', editingId);
      if (error) throw error;
      toast('Lançamento atualizado.');
    } else {
      const { data: inserted, error } = await supabaseClient.from('transactions').insert(payload).select().single();
      if (error) throw error;

      if (isBridge) {
        await createMirrorTransaction(inserted);
        toast('Pró-labore lançado e espelho criado na PF (aguardando conciliação).');
      } else {
        toast('Lançamento salvo.');
      }
    }

    closeModal();
    await loadEntityData();
    render();
  } catch (err) {
    console.error(err);
    toast('Erro ao salvar: ' + err.message, 'error');
  }
}

/* Exclui um lançamento. Se ele tiver espelho (pró-labore), avisa e exclui os dois juntos. */
async function deleteTransaction(id){
  const tx = state.transactions.find(t => t.id === id);
  if (!tx) return;

  const hasMirror = !!tx.mirror_transaction_id;
  const confirmMsg = hasMirror
    ? 'Esse lançamento está ligado a um espelho na outra entidade (PF/PJ). Excluir os dois lançamentos vinculados?'
    : 'Excluir este lançamento?';

  if (!confirm(confirmMsg)) return;

  try {
    if (hasMirror) {
      await supabaseClient.from('transactions').delete().eq('id', tx.mirror_transaction_id);
    }
    const { error } = await supabaseClient.from('transactions').delete().eq('id', id);
    if (error) throw error;

    toast('Lançamento excluído.');
    closeModal();
    await loadEntityData();
    render();
  } catch (err) {
    toast('Erro ao excluir: ' + err.message, 'error');
  }
}

/* ============================================================
   SELEÇÃO EM MASSA (página Lançamentos)
   ============================================================ */
function toggleTxSelection(id){
  if (state.selectedTxIds.has(id)) state.selectedTxIds.delete(id);
  else state.selectedTxIds.add(id);
  render();
}

function toggleSelectAllTx(){
  const txs = filteredTransactions();
  const allChecked = txs.length > 0 && txs.every(t => state.selectedTxIds.has(t.id));
  if (allChecked) {
    txs.forEach(t => state.selectedTxIds.delete(t.id));
  } else {
    txs.forEach(t => state.selectedTxIds.add(t.id));
  }
  render();
}

function clearTxSelection(){
  state.selectedTxIds.clear();
  render();
}

async function bulkDeleteTransactions(){
  const ids = Array.from(state.selectedTxIds);
  if (ids.length === 0) return;

  // inclui espelhos vinculados na contagem/exclusão, para não deixar órfãos
  const selectedTxs = state.transactions.filter(t => ids.includes(t.id));
  const mirrorIds = selectedTxs.filter(t => t.mirror_transaction_id && !ids.includes(t.mirror_transaction_id)).map(t => t.mirror_transaction_id);
  const allIds = Array.from(new Set([...ids, ...mirrorIds]));

  const extraWarning = mirrorIds.length > 0
    ? ` ${mirrorIds.length} lançamento(s) espelhado(s) na outra entidade (PF/PJ) também serão excluídos para manter a consistência.`
    : '';

  if (!confirm(`Excluir ${ids.length} lançamento(s) selecionado(s)?${extraWarning}`)) return;

  try {
    const { error } = await supabaseClient.from('transactions').delete().in('id', allIds);
    if (error) throw error;
    toast(`${allIds.length} lançamento(s) excluído(s).`);
    state.selectedTxIds.clear();
    await loadEntityData();
    render();
  } catch (err) {
    toast('Erro ao excluir em massa: ' + err.message, 'error');
  }
}

/* Cria a entrada espelhada na PF, ligada por mirror_transaction_id, status "aguardando" */
async function createMirrorTransaction(pjTransaction){
  const pfEntity = state.entities.find(e => e.kind === 'pf');
  if (!pfEntity) { toast('Entidade PF não encontrada — espelho não criado.', 'error'); return; }

  // categoria "Pró-labore GN Consultoria" dentro do grupo "Receitas" da PF
  const { data: pfGroups, error: ge } = await supabaseClient
    .from('groups').select('*, categories(*)').eq('entity_id', pfEntity.id).eq('flow_type', 'entrada');
  if (ge) { toast('Erro ao localizar categoria espelho na PF: ' + ge.message, 'error'); return; }

  let mirrorCategoryId = null;
  for (const g of (pfGroups || [])) {
    const cat = (g.categories || []).find(c => c.name.toLowerCase().includes('pró-labore gn') || c.name.toLowerCase().includes('pro-labore gn'));
    if (cat) { mirrorCategoryId = cat.id; break; }
  }

  const mirrorPayload = {
    entity_id: pfEntity.id,
    account_id: null,
    category_id: mirrorCategoryId,
    description: pjTransaction.description,
    amount: pjTransaction.amount,
    flow_type: 'entrada',
    date_competencia: pjTransaction.date_competencia,
    date_realizado: null,
    status: 'previsto',
    source: 'espelho_pj_pf',
    reconciliation_status: 'aguardando',
    mirror_transaction_id: pjTransaction.id
  };

  const { data: mirror, error: me } = await supabaseClient.from('transactions').insert(mirrorPayload).select().single();
  if (me) { toast('Lançamento PJ salvo, mas falhou ao criar espelho: ' + me.message, 'error'); return; }

  // liga a transação original ao espelho também (referência cruzada)
  await supabaseClient.from('transactions').update({ mirror_transaction_id: mirror.id }).eq('id', pjTransaction.id);
}

   INIT

boot();
</script>
